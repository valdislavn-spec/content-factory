name = "tg-cron"
main = "tg-cron.mjs"
compatibility_date = "2026-01-01"

# account_id берётся из переменной окружения CLOUDFLARE_ACCOUNT_ID.
# KV-неймспейс создаётся один раз: wrangler kv namespace create tg-cron-state
# и его id подставляется ниже.

[triggers]
crons = ["*/15 * * * *"]  # каждые 15 минут: слоты каналов идут по 10-минутной сетке

[[kv_namespaces]]
binding = "STATE"
id = "4d766ea68e1f46299c862681ab32d012"

[[d1_databases]]
binding = "DB"
database_name = "content-factory-state"
database_id = "7008a2a9-3d15-4ab8-aec6-db304da7bc92"
