name: apply-profile

# Ручное применение названий и описаний каналов из config/channels.<lang>.yaml.
# Запуск: Actions → apply-profile → Run workflow (language: en или es).
on:
  workflow_dispatch:
    inputs:
      language:
        description: "Набор каналов: en или es"
        required: true
        default: "en"
        type: choice
        options: ["en", "es"]
      dry_run:
        description: "true = только показать, false = применить в Telegram"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTENT_FACTORY_CHANNELS: config/channels.${{ inputs.language }}.yaml
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_API_BASE: ${{ vars.TELEGRAM_API_BASE }}
      TELEGRAM_CHAT_ID_TECH_AI_ES: ${{ secrets.TELEGRAM_CHAT_ID_TECH_AI_ES }}
      TELEGRAM_CHAT_ID_CRYPTO_ES: ${{ secrets.TELEGRAM_CHAT_ID_CRYPTO_ES }}
      TELEGRAM_CHAT_ID_FUTBOL_ES: ${{ secrets.TELEGRAM_CHAT_ID_FUTBOL_ES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply channel profile
        run: |
          python -m content_factory channels
          flags=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then flags="--dry-run"; fi
          python scripts/telegram_apply_profile.py $flags
