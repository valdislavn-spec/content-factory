name: x-check

# Ручная диагностика X/Twitter: OAuth 1.0a (постинг) + app-only bearer.
# Не публикует твиты: проверяет GET /2/users/me и POST /2/tweets с пустым телом.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      X_ACCOUNT_BLOB: ${{ secrets.X_ACCOUNT_BLOB }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe app-only bearer
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error
          token = os.environ["X_BEARER_TOKEN"].strip()
          url = "https://api.x.com/2/users/by/username/NValdislav"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token, "User-Agent": "content-factory-x-check"})
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  print("bearer users/by/username: HTTP", response.status, response.read().decode()[:400])
          except urllib.error.HTTPError as error:
              print("bearer users/by/username: HTTP", error.code, error.read().decode()[:400])
          PY
      - name: Check OAuth 1.0a credentials/write permission
        run: python scripts/x_check.py
