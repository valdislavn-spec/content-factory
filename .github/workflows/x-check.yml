name: x-check

# Ручная диагностика X/Twitter: OAuth 1.0a (постинг) + app-only bearer + OAuth2.
# Ничего не публикует: проверяет GET /2/users/me и POST /2/tweets с пустым телом.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      X_ACCOUNT_BLOB: ${{ secrets.X_ACCOUNT_BLOB }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      X_APP_ID: ${{ secrets.X_APP_ID }}
      X_OAUTH2_CLIENT_ID: ${{ secrets.X_OAUTH2_CLIENT_ID }}
      X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe app-only bearer
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error
          token = os.environ["X_BEARER_TOKEN"].strip()
          url = "https://api.x.com/2/users/by/username/NValdislav"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token, "User-Agent": "content-factory-x-check"})
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  print("bearer users/by/username: HTTP", response.status, response.read().decode()[:400])
          except urllib.error.HTTPError as error:
              print("bearer users/by/username: HTTP", error.code, error.read().decode()[:400])
          PY
      - name: Probe OAuth2 token exchange
        run: |
          python - <<'PY'
          import os, json, base64, urllib.parse, urllib.request, urllib.error
          cid = os.environ["X_OAUTH2_CLIENT_ID"].strip()
          csec = os.environ["X_OAUTH2_CLIENT_SECRET"].strip()
          at = os.environ["X_ACCESS_TOKEN"].strip()
          asec = os.environ["X_ACCESS_SECRET"].strip()
          form = urllib.parse.urlencode({
              "grant_type": "urn:ietf:params:oauth:grant-type:token-exchange",
              "subject_token": at,
              "subject_token_type": "urn:x:params:oauth:token-type:oauth1_token",
              "oauth_token_secret": asec,
          }).encode()
          basic = base64.b64encode((cid + ":" + csec).encode()).decode()
          req = urllib.request.Request(
              "https://api.x.com/2/oauth2/token",
              data=form,
              method="POST",
              headers={
                  "Authorization": "Basic " + basic,
                  "Content-Type": "application/x-www-form-urlencoded",
                  "User-Agent": "content-factory-x-check",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.loads(response.read())
                  print("oauth2 exchange: HTTP", response.status,
                        "| scope:", data.get("scope"),
                        "| expires_in:", data.get("expires_in"),
                        "| refresh:", bool(data.get("refresh_token")))
          except urllib.error.HTTPError as error:
              body = error.read().decode()
              print("oauth2 exchange: HTTP", error.code, "|", body[:500])
          except Exception as error:
              print("oauth2 exchange:", type(error).__name__, error)
          PY
      - name: Probe OAuth2 client pairs
        run: |
          python - <<'PY'
          import os, base64, json, urllib.parse, urllib.request, urllib.error
          vals = {
              "app_id": os.environ.get("X_APP_ID","").strip(),
              "client_id": os.environ.get("X_OAUTH2_CLIENT_ID","").strip(),
              "client_secret": os.environ.get("X_OAUTH2_CLIENT_SECRET","").strip(),
              "api_key": os.environ.get("X_API_KEY","").strip(),
              "api_secret": os.environ.get("X_API_SECRET","").strip(),
          }
          pairs = [(a+"+"+b, vals[a], vals[b]) for a in vals for b in vals if a != b]
          for label, cid, csec in pairs:
              if not cid or not csec:
                  print(label, "SKIP empty")
                  continue
              form = urllib.parse.urlencode({
                  "grant_type": "authorization_code",
                  "code": "invalid-probe-code",
                  "redirect_uri": "http://localhost:8080/callback",
                  "code_verifier": "a" * 43,
              }).encode()
              basic = base64.b64encode((cid + ":" + csec).encode()).decode()
              req = urllib.request.Request(
                  "https://api.x.com/2/oauth2/token",
                  data=form, method="POST",
                  headers={"Authorization": "Basic " + basic,
                           "Content-Type": "application/x-www-form-urlencoded",
                           "User-Agent": "content-factory-x-check"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      print(label, "HTTP", response.status)
              except urllib.error.HTTPError as error:
                  body = error.read().decode()
                  try:
                      data = json.loads(body)
                      print(label, "HTTP", error.code, "|", data.get("error"), "|", data.get("error_description"))
                  except Exception:
                      print(label, "HTTP", error.code, "|", body[:300])
              except Exception as error:
                  print(label, type(error).__name__, str(error)[:200])
          PY
      - name: Check OAuth 1.0a credentials/write permission
        run: python scripts/x_check.py
