name: add-real-contact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_LIST_ID_EN: ${{ secrets.BREVO_LIST_ID_EN }}
    steps:
      - name: Add owner email to EN list
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ["BREVO_API_KEY"]
          list_id = int(os.environ["BREVO_LIST_ID_EN"])
          payload = {
              "email": "valdislav.n@gmail.com",
              "listIds": [list_id],
              "updateEnabled": True,
              "attributes": {"LANGUAGE": "en", "SOURCE": "owner"},
          }
          req = urllib.request.Request("https://api.brevo.com/v3/contacts",
              data=json.dumps(payload).encode(), method="POST",
              headers={"api-key": key, "Content-Type": "application/json", "Accept": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("CONTACT:", r.status, r.read().decode()[:300])
          except urllib.error.HTTPError as e:
              print("CONTACT ERROR:", e.code, e.read().decode()[:300])
          req = urllib.request.Request(f"https://api.brevo.com/v3/contacts/lists/{list_id}",
              headers={"api-key": key, "Accept": "application/json"})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.loads(r.read().decode())
          print("LIST:", data.get("name"), "totalSubscribers=", data.get("totalSubscribers"))
          PY

