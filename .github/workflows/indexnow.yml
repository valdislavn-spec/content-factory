name: indexnow

# Мгновенная индексация новых страниц хаба в Bing/Yandex/Seznam.
on:
  push:
    paths:
      - "docs/sitemap.xml"
      - "docs/travel/**"
      - "docs/flights/**"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ping IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python scripts/indexnow_ping.py
