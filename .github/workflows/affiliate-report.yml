name: affiliate-report

# Недельный отчёт по кликам партнёрских ссылок (link-tracker) в docs/reports/.
# Секреты репозитория: LINK_TRACKER_BASE, LINK_TRACKER_STATS_TOKEN.
on:
  schedule:
    - cron: "20 6 * * 1"   # каждый понедельник 06:20 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: affiliate-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build weekly report
        env:
          LINK_TRACKER_BASE: ${{ secrets.LINK_TRACKER_BASE }}
          LINK_TRACKER_STATS_TOKEN: ${{ secrets.LINK_TRACKER_STATS_TOKEN }}
        run: |
          DATE=$(date -u +%F)
          python scripts/affiliate_report.py --days 7 --out "docs/reports/affiliate-clicks-$DATE.md"

      - name: Commit report
        run: |
          git config user.name "content-factory-bot"
          git config user.email "content-factory-bot@users.noreply.github.com"
          git add docs/reports/affiliate-clicks-*.md
          git diff --cached --quiet && echo "no changes" || git commit -m "report(affiliate): weekly clicks $(date -u +%F)"
          git push || true
