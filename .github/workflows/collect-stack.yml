name: collect-stack

# Стек новостей за последние N часов по всем каналам (EN+ES). Только чтение:
# ничего не публикует, отчёт печатается в лог и уходит в артефакт.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Окно в часах"
        required: true
        default: "4"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      WORLD_NEWS_API_KEY: ${{ secrets.WORLD_NEWS_API_KEY }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      GDELT_CLOUD_API_KEY: ${{ secrets.GDELT_CLOUD_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Collect stack
        run: python scripts/collect_stack.py --hours "${{ inputs.hours }}" --per-channel 10
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-stack
          path: data/reports/stack-*.md
          if-no-files-found: ignore
          retention-days: 14
