name: temp-shortlink-restore

# Временный workflow: проверить, что короткие ссылки is.gd живы.
# (Локальная сеть не достаёт is.gd/Cloudflare; HEAD-запросы дают ложный 404,
# поэтому проверяем GET с GitHub-раннера.)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check aliases
        run: |
          for a in Flights BaliTrip DubaiTrip CryptoDigest AINews SportsNews ESCrypto ESNews ESport ESimDeal CarRental Compensair EuropeTrip; do
            curl -s -o /dev/null -w "$a: HTTP %{http_code} -> %{redirect_url}\n" -m 20 "https://is.gd/$a" || echo "$a: FAILED"
          done
