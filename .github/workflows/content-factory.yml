name: content-factory-cloud

# Запуск контент-завода без собственного ПК и без Oracle:
# запуск ровно в слоты каналов (16 раз/сутки, UTC), а не каждые 10 минут —
# так укладываемся в бесплатные ~2000 минут GitHub Actions для приватного
# репозитория. Публикация выключена, пока не задана переменная
# CONTENT_FACTORY_DRY_RUN=false.

on:
  schedule:
    # Слоты каналов :00 — 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
    # Слоты каналов :30 — 01:30, 04:30, 07:30, 10:30, 13:30, 16:30, 19:30, 22:30 UTC
    - cron: "30 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Два запуска не должны одновременно писать в SQLite.
concurrency:
  group: content-factory-cloud
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: Europe/Moscow
      # Пусто/не задано = безопасный dry-run из config/settings.yaml.
      # Значения: "true" (по умолчанию, писать в outbox) / "false" (публиковать).
      CONTENT_FACTORY_DRY_RUN: ${{ vars.CONTENT_FACTORY_DRY_RUN }}
      # Пусто = channels_file из config/settings.yaml (сейчас — английские каналы).
      # Для русских каналов: Variables → CONTENT_FACTORY_CHANNELS=config/channels.yaml
      CONTENT_FACTORY_CHANNELS: ${{ vars.CONTENT_FACTORY_CHANNELS }}

      # --- Публикация в Telegram / ВКонтакте ----------------------------
      # Секреты репозитория: Settings → Secrets and variables → Actions.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_TECH_AI: ${{ secrets.TELEGRAM_CHAT_ID_TECH_AI }}
      TELEGRAM_CHAT_ID_BUSINESS_FINANCE: ${{ secrets.TELEGRAM_CHAT_ID_BUSINESS_FINANCE }}
      TELEGRAM_CHAT_ID_SCIENCE_HEALTH: ${{ secrets.TELEGRAM_CHAT_ID_SCIENCE_HEALTH }}
      TELEGRAM_CHAT_ID_AUTO: ${{ secrets.TELEGRAM_CHAT_ID_AUTO }}
      TELEGRAM_CHAT_ID_TRAVEL: ${{ secrets.TELEGRAM_CHAT_ID_TRAVEL }}
      TELEGRAM_CHAT_ID_CULTURE: ${{ secrets.TELEGRAM_CHAT_ID_CULTURE }}

      # ВКонтакте (опционально).
      VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
      VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}

      # Telegram-каналы как источники (Telethon, опционально).
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}

      # --- LLM-провайдеры ------------------------------------------------
      # Основной — Cloudflare Workers AI (free-план: 10 000 neurons/день).
      # На раннерах GitHub Actions доступны и OpenAI/Groq/OpenRouter, которые
      # из РФ заблокированы по гео.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}

      # Российские LLM-провайдеры (опционально).
      GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
      YANDEXGPT_API_KEY: ${{ secrets.YANDEXGPT_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}

      # --- Новостные API / поиск ----------------------------------------
      # Пустые значения безопасны: источник просто пропускается.
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      WORLD_NEWS_API_KEY: ${{ secrets.WORLD_NEWS_API_KEY }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      APITUBE_API_KEY: ${{ secrets.APITUBE_API_KEY }}
      TRENDS_API_KEY: ${{ secrets.TRENDS_API_KEY }}
      GDELT_CLOUD_API_KEY: ${{ secrets.GDELT_CLOUD_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}

      # --- Dify (опционально) -------------------------------------------
      DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
      DIFY_BASE_URL: ${{ secrets.DIFY_BASE_URL }}
      DIFY_POSTS_API_KEY: ${{ secrets.DIFY_POSTS_API_KEY }}
      DIFY_NEWS_API_KEY: ${{ secrets.DIFY_NEWS_API_KEY }}
      DIFY_TRENDS_API_KEY: ${{ secrets.DIFY_TRENDS_API_KEY }}
      DIFY_SEO_API_KEY: ${{ secrets.DIFY_SEO_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data directory
        run: mkdir -p data

      # SQLite, состояние расписания и LLM-кэш/бюджеты переживают запуски
      # через кэш GitHub. Ключ уникален для каждого запуска, restore-keys
      # подхватывает последний.
      - name: Restore SQLite, scheduler and LLM state
        uses: actions/cache@v4
        with:
          path: |
            data/factory.sqlite3
            data/schedule_state.json
            data/llm_cache.sqlite3
            data/llm_tokens.json
            data/llm_usage.json
            data/source_*_usage.json
          key: cf-state-${{ github.run_id }}
          restore-keys: |
            cf-state-

      - name: Init project (idempotent)
        run: python -m content_factory init

      - name: Show channels and mode
        run: python -m content_factory channels

      # Показывает, какие LLM-провайдеры увидели ключи (без вызовов API).
      - name: Show LLM chain
        run: |
          python - <<'PY'
          from content_factory.config import Settings
          from content_factory.nlp.llm import get_llm

          print(get_llm(Settings.load()).describe())
          PY

      - name: Scheduler tick
        run: python -m content_factory daemon --once

      - name: Upload outbox, reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-factory-${{ github.run_number }}
          path: |
            data/outbox
            data/reports
            data/logs
          if-no-files-found: ignore
          retention-days: 7
