name: content-factory-cloud-en-es

# Контент-завод в облаке для ДВУХ языковых наборов в ОДНОМ джобе:
#   en — 6 английских каналов (config/channels.en.yaml), 16 слотов/сутки;
#   es — 3 испанских канала (config/channels.es.yaml), 6 слотов/сутки.
#
# Почему один job, а не матрица из двух: вдвое меньше минут GitHub Actions
# (приватный репозиторий = лимит 2000 мин/мес), меньше шансов упереться
# в лимит и внезапно остановить публикации. Состояние (SQLite, слоты, кэш
# LLM) общее: id каналов en/es не пересекаются.
#
# Риски и защита:
#   • cron публикует по слотам (live по умолчанию);
#   • ручной запуск (workflow_dispatch) по умолчанию dry-run — live только
#     при явном выборе publish=live;
#   • ES-тик идёт сразу после EN по config/channels.es.yaml;
#   • чтобы прогнать cron в dry-run, поставьте Variable
#     CONTENT_FACTORY_DRY_RUN=true (потом снимите) — удобно для первого
#     прогона в облаке;
#   • concurrency: один запуск за раз, без наложений.

on:
  schedule:
    # ОСНОВНОЙ планировщик — Cloudflare Worker tg-cron (каждые 15 минут
    # дёргает workflow_dispatch). GitHub cron ненадёжен и запускается
    # нерегулярно, поэтому здесь — РОВНО ОДИН резервный запуск раз в час
    # (:17 UTC). Перед публикацией шаг-guard проверяет, был ли свежий
    # запуск за последние 30 минут, и при наличии свежего — пропускает слот.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Режим ручного запуска"
        required: true
        default: "dry-run"
        type: choice
        options:
          - "dry-run"   # безопасно: посты только в outbox/artifacts
          - "live"      # реальная публикация

concurrency:
  group: content-factory-cloud
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # guard читает список последних запусков

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ВАЖНО: concurrency только на уровне workflow (выше). Дублировать его
    # на уровне job нельзя: job ждёт группу, которую держит его же workflow,
    # и падает до запуска шагов (0 steps).
    env:
      TZ: Europe/Moscow
      # cron → live (если не задана Variable CONTENT_FACTORY_DRY_RUN=true).
      # ручной запуск → dry-run, кроме явного publish=live.
      CONTENT_FACTORY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish != 'live') || vars.CONTENT_FACTORY_DRY_RUN || 'false' }}

      # --- Публикация в Telegram / ВКонтакте ----------------------------
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # ES-каналы: id берутся из GitHub Secrets (см. config/channels.es.yaml).
      TELEGRAM_CHAT_ID_TECH_AI_ES: ${{ secrets.TELEGRAM_CHAT_ID_TECH_AI_ES }}
      TELEGRAM_CHAT_ID_CRYPTO_ES: ${{ secrets.TELEGRAM_CHAT_ID_CRYPTO_ES }}
      TELEGRAM_CHAT_ID_FUTBOL_ES: ${{ secrets.TELEGRAM_CHAT_ID_FUTBOL_ES }}
      # RU-каналы (на случай добавления ru-тика ниже).
      TELEGRAM_CHAT_ID_TECH_AI: ${{ secrets.TELEGRAM_CHAT_ID_TECH_AI }}
      TELEGRAM_CHAT_ID_BUSINESS_FINANCE: ${{ secrets.TELEGRAM_CHAT_ID_BUSINESS_FINANCE }}
      TELEGRAM_CHAT_ID_SCIENCE_HEALTH: ${{ secrets.TELEGRAM_CHAT_ID_SCIENCE_HEALTH }}
      TELEGRAM_CHAT_ID_AUTO: ${{ secrets.TELEGRAM_CHAT_ID_AUTO }}
      TELEGRAM_CHAT_ID_TRAVEL: ${{ secrets.TELEGRAM_CHAT_ID_TRAVEL }}
      TELEGRAM_CHAT_ID_CULTURE: ${{ secrets.TELEGRAM_CHAT_ID_CULTURE }}

      # ВКонтакте (опционально).
      VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
      VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}

      # Telegram-каналы как источники (Telethon, опционально).
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}

      # --- LLM-провайдеры ------------------------------------------------
      # Основной — Ollama Cloud (open-модели), резерв — Cloudflare Workers AI
      # (free 10 000 neurons/день) и локальные/российские провайдеры.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      # LangSmith-трейсы моста «мозга» (mcp-content-factory vendored).
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: content-factory-actions
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}

      # Российские LLM-провайдеры (опционально).
      GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
      YANDEXGPT_API_KEY: ${{ secrets.YANDEXGPT_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}

      # --- Новостные API / поиск ----------------------------------------
      # Пустые значения безопасны: источник просто пропускается.
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      WORLD_NEWS_API_KEY: ${{ secrets.WORLD_NEWS_API_KEY }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      APITUBE_API_KEY: ${{ secrets.APITUBE_API_KEY }}
      TRENDS_API_KEY: ${{ secrets.TRENDS_API_KEY }}
      GDELT_CLOUD_API_KEY: ${{ secrets.GDELT_CLOUD_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}

      # --- Dify (опционально) -------------------------------------------
      DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
      DIFY_BASE_URL: ${{ secrets.DIFY_BASE_URL }}
      DIFY_POSTS_API_KEY: ${{ secrets.DIFY_POSTS_API_KEY }}
      DIFY_NEWS_API_KEY: ${{ secrets.DIFY_NEWS_API_KEY }}
      DIFY_TRENDS_API_KEY: ${{ secrets.DIFY_TRENDS_API_KEY }}
      DIFY_SEO_API_KEY: ${{ secrets.DIFY_SEO_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # «Мозг» (mcp-content-factory) лежит в vendor/ — так GitHub Actions
      # видит его в одном репозитории. Шаги optional: если установка/смоук
      # упадут, автопостинг продолжит на встроенной генерации (fallback моста).
      - name: Install brain engine (optional)
        continue-on-error: true
        run: |
          pip install -e "vendor/mcp-content-factory[langchain]" "langgraph>=0.6,<1"

      - name: Brain smoke test (optional, mock, no network)
        continue-on-error: true
        run: |
          printf '%s' '{"articles":[{"title":"Brain smoke test","url":"https://example.com/smoke","summary":"Smoke test for the vendored brain bridge.","source":"test"}],"channel":"crypto-news","language":"en"}' \
            | python -m mcp_factory brain --config vendor/mcp-content-factory/config/demo.json --engine langgraph --grounding --out "$RUNNER_TEMP/brain-smoke" >/dev/null
          echo "brain smoke: ok"

      - name: Prepare data directory
        run: mkdir -p data

      # SQLite, состояние слотов и LLM-кэш переживают запуски через кэш GitHub.
      - name: Restore SQLite, scheduler and LLM state
        uses: actions/cache@v4
        with:
          path: |
            data/factory.sqlite3
            data/schedule_state.json
            data/schedule_state_es.json
            data/llm_cache.sqlite3
            data/llm_tokens.json
            data/llm_usage.json
            data/llm_usage_*.json
            data/source_*_usage.json
          key: cf-state-${{ github.run_id }}
          restore-keys: |
            cf-state-

      - name: Restore durable schedule state
        env:
          ALERT_GITHUB_TOKEN: ${{ secrets.ALERT_GITHUB_TOKEN }}
        run: python scripts/state_sync.py pull
        continue-on-error: true

      - name: Backup cron guard (skip if a run was recent)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          url = ("https://api.github.com/repos/{}/actions/workflows/"
                   "content-factory.yml/runs?per_page=1").format(repo)
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "content-factory-backup-cron",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  run = json.load(response)["workflow_runs"][0]
              created = datetime.datetime.fromisoformat(
                  run["created_at"].replace("Z", "+00:00")
              )
              age = (datetime.datetime.now(datetime.timezone.utc) - created).total_seconds() / 60
              print("Последний запуск #{}: {} ({:.0f} мин назад)".format(
                  run.get("run_number"), run["created_at"], age))
              if age < 30:
                  print("Свежий запуск есть — backup-крон пропускает слот")
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                      handle.write("BACKUP_SKIP=1\n")
          except Exception as exc:  # noqa: BLE001
              print("guard: проверка не удалась ({}), работаем как резерв".format(exc))
          PY

      - name: Init project (idempotent)
        run: python -m content_factory init

      - name: Show EN channels
        run: python -m content_factory channels

      # Показывает, какие LLM-провайдеры увидели ключи (без вызовов API).
      - name: Show LLM chain
        run: |
          python - <<'PY'
          from content_factory.config import Settings
          from content_factory.nlp.llm import get_llm

          print(get_llm(Settings.load()).describe())
          PY

      - name: EN tick (config/channels.en.yaml)
        if: env.BACKUP_SKIP != '1'
        run: python -m content_factory daemon --once

      # ES-тик: испанские каналы (config/channels.es.yaml, ID в конфиге).
      - name: ES tick (config/channels.es.yaml)
        if: always() && env.BACKUP_SKIP != '1' 
        env:
          CONTENT_FACTORY_CHANNELS: config/channels.es.yaml
          CONTENT_FACTORY_STATE_PATH: data/schedule_state_es.json
        run: |
          python -m content_factory channels
          python -m content_factory daemon --once

      - name: Persist durable schedule state
        if: always()
        env:
          ALERT_GITHUB_TOKEN: ${{ secrets.ALERT_GITHUB_TOKEN }}
        run: python scripts/state_sync.py push
        continue-on-error: true

      - name: Check publication health
        if: env.CONTENT_FACTORY_DRY_RUN == 'false'
        run: python scripts/check_publish_health.py

      - name: Upload outbox, reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-factory-${{ github.run_number }}
          path: |
            data/outbox
            data/reports
            data/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          python scripts/notify_telegram.py "❌ content-factory: запуск упал — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
