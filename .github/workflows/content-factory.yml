name: content-factory-cloud-en-es

# Контент-завод в облаке для ДВУХ языковых наборов в ОДНОМ джобе:
#   en — 6 английских каналов (config/channels.en.yaml), 16 слотов/сутки;
#   es — 3 испанских канала (config/channels.es.yaml), 6 слотов/сутки.
#
# Почему один job, а не матрица из двух: вдвое меньше минут GitHub Actions
# (приватный репозиторий = лимит 2000 мин/мес), меньше шансов упереться
# в лимит и внезапно остановить публикации. Состояние (SQLite, слоты, кэш
# LLM) общее: id каналов en/es не пересекаются.
#
# Риски и защита:
#   • cron публикует по слотам (live по умолчанию);
#   • ручной запуск (workflow_dispatch) по умолчанию dry-run — live только
#     при явном выборе publish=live;
#   • ES-тик идёт сразу после EN по config/channels.es.yaml;
#   • чтобы прогнать cron в dry-run, поставьте Variable
#     CONTENT_FACTORY_DRY_RUN=true (потом снимите) — удобно для первого
#     прогона в облаке;
#   • concurrency: один запуск за раз, без наложений.

on:
  schedule:
    # Плавающее расписание: каждый слот сдвинут на +2..+19 минут от ровного
    # времени (не 00:00/01:30, а 00:08/01:47 и т.д.), плюс GitHub добавляет
    # естественную задержку 5–15 минут — посты не выходят в одинаковые минуты.
    # EN: 16 слотов/сутки; ES: 6 слотов/сутки — попадают в эти же запуски.
    - cron: "8 0 * * *"
    - cron: "47 1 * * *"
    - cron: "14 3 * * *"
    - cron: "38 4 * * *"
    - cron: "11 6 * * *"
    - cron: "52 7 * * *"
    - cron: "6 9 * * *"
    - cron: "43 10 * * *"
    - cron: "19 12 * * *"
    - cron: "41 13 * * *"
    - cron: "4 15 * * *"
    - cron: "37 16 * * *"
    - cron: "12 18 * * *"
    - cron: "46 19 * * *"
    - cron: "9 21 * * *"
    - cron: "33 22 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Режим ручного запуска"
        required: true
        default: "dry-run"
        type: choice
        options:
          - "dry-run"   # безопасно: посты только в outbox/artifacts
          - "live"      # реальная публикация

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: content-factory-cloud
      cancel-in-progress: false

    env:
      TZ: Europe/Moscow
      # cron → live (если не задана Variable CONTENT_FACTORY_DRY_RUN=true).
      # ручной запуск → dry-run, кроме явного publish=live.
      CONTENT_FACTORY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish != 'live') || vars.CONTENT_FACTORY_DRY_RUN || 'false' }}

      # --- Публикация в Telegram / ВКонтакте ----------------------------
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # ES-каналы: ID прописаны в config/channels.es.yaml (секреты не нужны).
      TELEGRAM_CHAT_ID_TECH_AI_ES: ${{ secrets.TELEGRAM_CHAT_ID_TECH_AI_ES }}
      TELEGRAM_CHAT_ID_CRYPTO_ES: ${{ secrets.TELEGRAM_CHAT_ID_CRYPTO_ES }}
      TELEGRAM_CHAT_ID_FUTBOL_ES: ${{ secrets.TELEGRAM_CHAT_ID_FUTBOL_ES }}
      # RU-каналы (на случай добавления ru-тика ниже).
      TELEGRAM_CHAT_ID_TECH_AI: ${{ secrets.TELEGRAM_CHAT_ID_TECH_AI }}
      TELEGRAM_CHAT_ID_BUSINESS_FINANCE: ${{ secrets.TELEGRAM_CHAT_ID_BUSINESS_FINANCE }}
      TELEGRAM_CHAT_ID_SCIENCE_HEALTH: ${{ secrets.TELEGRAM_CHAT_ID_SCIENCE_HEALTH }}
      TELEGRAM_CHAT_ID_AUTO: ${{ secrets.TELEGRAM_CHAT_ID_AUTO }}
      TELEGRAM_CHAT_ID_TRAVEL: ${{ secrets.TELEGRAM_CHAT_ID_TRAVEL }}
      TELEGRAM_CHAT_ID_CULTURE: ${{ secrets.TELEGRAM_CHAT_ID_CULTURE }}

      # ВКонтакте (опционально).
      VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
      VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}

      # Telegram-каналы как источники (Telethon, опционально).
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}

      # --- LLM-провайдеры ------------------------------------------------
      # Основной — Ollama Cloud (open-модели), резерв — Cloudflare Workers AI
      # (free 10 000 neurons/день) и локальные/российские провайдеры.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}

      # Российские LLM-провайдеры (опционально).
      GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
      YANDEXGPT_API_KEY: ${{ secrets.YANDEXGPT_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}

      # --- Новостные API / поиск ----------------------------------------
      # Пустые значения безопасны: источник просто пропускается.
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      WORLD_NEWS_API_KEY: ${{ secrets.WORLD_NEWS_API_KEY }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      APITUBE_API_KEY: ${{ secrets.APITUBE_API_KEY }}
      TRENDS_API_KEY: ${{ secrets.TRENDS_API_KEY }}
      GDELT_CLOUD_API_KEY: ${{ secrets.GDELT_CLOUD_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}

      # --- Dify (опционально) -------------------------------------------
      DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
      DIFY_BASE_URL: ${{ secrets.DIFY_BASE_URL }}
      DIFY_POSTS_API_KEY: ${{ secrets.DIFY_POSTS_API_KEY }}
      DIFY_NEWS_API_KEY: ${{ secrets.DIFY_NEWS_API_KEY }}
      DIFY_TRENDS_API_KEY: ${{ secrets.DIFY_TRENDS_API_KEY }}
      DIFY_SEO_API_KEY: ${{ secrets.DIFY_SEO_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data directory
        run: mkdir -p data

      # SQLite, состояние слотов и LLM-кэш переживают запуски через кэш GitHub.
      - name: Restore SQLite, scheduler and LLM state
        uses: actions/cache@v4
        with:
          path: |
            data/factory.sqlite3
            data/schedule_state.json
            data/llm_cache.sqlite3
            data/llm_tokens.json
            data/llm_usage.json
            data/source_*_usage.json
          key: cf-state-${{ github.run_id }}
          restore-keys: |
            cf-state-

      - name: Init project (idempotent)
        run: python -m content_factory init

      - name: Show EN channels
        run: python -m content_factory channels

      # Показывает, какие LLM-провайдеры увидели ключи (без вызовов API).
      - name: Show LLM chain
        run: |
          python - <<'PY'
          from content_factory.config import Settings
          from content_factory.nlp.llm import get_llm

          print(get_llm(Settings.load()).describe())
          PY

      - name: EN tick (config/channels.en.yaml)
        run: python -m content_factory daemon --once

      # ES-тик: испанские каналы (config/channels.es.yaml, ID в конфиге).
      - name: ES tick (config/channels.es.yaml)
        if: always()
        env:
          CONTENT_FACTORY_CHANNELS: config/channels.es.yaml
        run: |
          python -m content_factory channels
          python -m content_factory daemon --once

      - name: Upload outbox, reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-factory-${{ github.run_number }}
          path: |
            data/outbox
            data/reports
            data/logs
          if-no-files-found: ignore
          retention-days: 7
