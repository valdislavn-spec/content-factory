name: content-factory-cloud-en-es

# Контент-завод в облаке для ДВУХ языковых наборов сразу:
#   en — 6 английских каналов (config/channels.en.yaml), 16 слотов/сутки;
#   es — 3 испанских канала (config/channels.es.yaml), 6 слотов/сутки.
# Матрица lang = [en, es]: один cron, два независимых джоба со своими
# кэшами состояния, артефактами и concurrency-группами.
# Публикация включена; безопасный режим — переменная CONTENT_FACTORY_DRY_RUN=true.

on:
  schedule:
    # Слоты :00 UTC — 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
    # Слоты :30 UTC — 01:30, 04:30, 07:30, 10:30, 13:30, 16:30, 19:30, 22:30
    - cron: "30 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lang: [en, es]
    concurrency:
      group: content-factory-cloud-${{ matrix.lang }}
      cancel-in-progress: false

    env:
      TZ: Europe/Moscow
      # true = безопасный dry-run (только outbox/артефакты).
      # Не задано / пусто → реальная публикация.
      CONTENT_FACTORY_DRY_RUN: ${{ vars.CONTENT_FACTORY_DRY_RUN || 'false' }}
      # Набор каналов задаёт матрица: en → channels.en.yaml, es → channels.es.yaml.
      CONTENT_FACTORY_CHANNELS: config/channels.${{ matrix.lang }}.yaml

      # --- Публикация в Telegram / ВКонтакте ----------------------------
      # Секреты репозитория: Settings → Secrets and variables → Actions.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # ES-каналы: chat_id подставляются из секретов; пустые = канал пропускается.
      TELEGRAM_CHAT_ID_TECH_AI_ES: ${{ secrets.TELEGRAM_CHAT_ID_TECH_AI_ES }}
      TELEGRAM_CHAT_ID_CRYPTO_ES: ${{ secrets.TELEGRAM_CHAT_ID_CRYPTO_ES }}
      TELEGRAM_CHAT_ID_FUTBOL_ES: ${{ secrets.TELEGRAM_CHAT_ID_FUTBOL_ES }}
      # RU-каналы (на случай добавления ru в матрицу).
      TELEGRAM_CHAT_ID_TECH_AI: ${{ secrets.TELEGRAM_CHAT_ID_TECH_AI }}
      TELEGRAM_CHAT_ID_BUSINESS_FINANCE: ${{ secrets.TELEGRAM_CHAT_ID_BUSINESS_FINANCE }}
      TELEGRAM_CHAT_ID_SCIENCE_HEALTH: ${{ secrets.TELEGRAM_CHAT_ID_SCIENCE_HEALTH }}
      TELEGRAM_CHAT_ID_AUTO: ${{ secrets.TELEGRAM_CHAT_ID_AUTO }}
      TELEGRAM_CHAT_ID_TRAVEL: ${{ secrets.TELEGRAM_CHAT_ID_TRAVEL }}
      TELEGRAM_CHAT_ID_CULTURE: ${{ secrets.TELEGRAM_CHAT_ID_CULTURE }}

      # ВКонтакте (опционально).
      VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
      VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}

      # Telegram-каналы как источники (Telethon, опционально).
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}

      # --- LLM-провайдеры ------------------------------------------------
      # Основной — Cloudflare Workers AI (free-план: 10 000 neurons/день).
      # На раннерах GitHub Actions доступны и OpenAI/Groq/OpenRouter, которые
      # из РФ заблокированы по гео.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}

      # Российские LLM-провайдеры (опционально).
      GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
      YANDEXGPT_API_KEY: ${{ secrets.YANDEXGPT_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}

      # --- Новостные API / поиск ----------------------------------------
      # Пустые значения безопасны: источник просто пропускается.
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      WORLD_NEWS_API_KEY: ${{ secrets.WORLD_NEWS_API_KEY }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      APITUBE_API_KEY: ${{ secrets.APITUBE_API_KEY }}
      TRENDS_API_KEY: ${{ secrets.TRENDS_API_KEY }}
      GDELT_CLOUD_API_KEY: ${{ secrets.GDELT_CLOUD_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}

      # --- Dify (опционально) -------------------------------------------
      DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
      DIFY_BASE_URL: ${{ secrets.DIFY_BASE_URL }}
      DIFY_POSTS_API_KEY: ${{ secrets.DIFY_POSTS_API_KEY }}
      DIFY_NEWS_API_KEY: ${{ secrets.DIFY_NEWS_API_KEY }}
      DIFY_TRENDS_API_KEY: ${{ secrets.DIFY_TRENDS_API_KEY }}
      DIFY_SEO_API_KEY: ${{ secrets.DIFY_SEO_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data directory
        run: mkdir -p data

      # SQLite, состояние расписания и LLM-кэш/бюджеты переживают запуски
      # через кэш GitHub. Ключ свой на каждый язык и запуск.
      - name: Restore SQLite, scheduler and LLM state
        uses: actions/cache@v4
        with:
          path: |
            data/factory.sqlite3
            data/schedule_state.json
            data/llm_cache.sqlite3
            data/llm_tokens.json
            data/llm_usage.json
            data/source_*_usage.json
          key: cf-state-${{ matrix.lang }}-${{ github.run_id }}
          restore-keys: |
            cf-state-${{ matrix.lang }}-

      - name: Init project (idempotent)
        run: python -m content_factory init

      - name: Show channels and mode
        run: python -m content_factory channels

      # Показывает, какие LLM-провайдеры увидели ключи (без вызовов API).
      - name: Show LLM chain
        run: |
          python - <<'PY'
          from content_factory.config import Settings
          from content_factory.nlp.llm import get_llm

          print(get_llm(Settings.load()).describe())
          PY

      - name: Scheduler tick
        run: python -m content_factory daemon --once

      - name: Upload outbox, reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-factory-${{ matrix.lang }}-${{ github.run_number }}
          path: |
            data/outbox
            data/reports
            data/logs
          if-no-files-found: ignore
          retention-days: 7
