name: crypto-signals

# Авто-сигналы по крипте → отдельный канал SIGNAL CRYPTO (@BESTsignal0007).
# Данные — публичные API бирж (без ключей), публикация — Telegram Bot API.
# Quality: сигнал только при подтверждении >=2 бирж; бэктест — scripts/signals_backtest.py.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "true = публиковать сигналы в канал, false = только лог"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: crypto-signals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_CRYPTO_SIGNALS: ${{ secrets.TELEGRAM_CHAT_ID_CRYPTO_SIGNALS }}
      TELEGRAM_API_BASE: ${{ vars.TELEGRAM_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ensure data dir
        run: mkdir -p data
      - name: Restore signals state
        uses: actions/cache@v4
        with:
          path: data/signals_state.json
          key: crypto-signals-state-${{ github.run_id }}
          restore-keys: crypto-signals-state-
      - name: Generate signals (loop ~5h40m, every 15 min)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            for i in $(seq 1 20); do
              echo "=== iteration $i/20 $(date -u +%H:%M:%SZ) ==="
              python scripts/crypto_signals.py --publish || true
              if [ "$i" -lt 20 ]; then sleep 900; fi
            done
          elif [ "${{ inputs.publish }}" = "true" ]; then
            python scripts/crypto_signals.py --publish
          else
            python scripts/crypto_signals.py --dry-run
          fi
      - name: Upload state
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypto-signals-state
          path: data/signals_state.json
          if-no-files-found: ignore
          retention-days: 7
