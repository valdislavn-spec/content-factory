name: ops-agent

# Многофункциональный операционный агент: раз в день сам собирает метрики,
# проверяет здоровье пайплайна/промо и присылает сводку с приоритетами.
# Работает на бесплатном Gemini (секрет GEMINI_API_KEY), без внешних фреймворков.
on:
  schedule:
    - cron: "20 9 * * *"   # после growth-report (09:10) и heartbeat (09:00)
  workflow_dispatch:
    inputs:
      task:
        description: "Свободная задача (пусто = ежедневный обход)"
        required: false
        default: ""

concurrency:
  group: ops-agent
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_ALT: ${{ secrets.GEMINI_API_KEY_ALT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
      TELEGRAM_API_BASE: ${{ vars.TELEGRAM_API_BASE }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LINK_TRACKER_BASE: ${{ secrets.LINK_TRACKER_BASE }}
      LINK_TRACKER_STATS_TOKEN: ${{ secrets.LINK_TRACKER_STATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run ops agent
        run: |
          python -m content_factory.agents.ops_agent --send --task "${{ github.event.inputs.task }}"
