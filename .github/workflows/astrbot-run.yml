name: astrbot

# AstrBot (AI-ассистент) на бесплатном GitHub Actions в сменах.
# Каждый запуск: restore state из HF dataset → конфиг из секретов → 5ч30м работы → save state.
# Ограничение job: 6 часов; cron раз в 6 часов (возможны паузы 10–25 мин).
on:
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astrbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      ASTRBOT_ROOT: ${{ github.workspace }}/run
      HF_TOKEN: ${{ secrets.HUGGINGFACE_API_KEY }}
      HF_REPO: ERPSAS/cf-astrbot-state
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install AstrBot
        run: |
          python -m pip install --upgrade pip
          pip install "astrbot==4.29.4" "huggingface_hub>=0.24"

      - name: Restore state
        run: |
          mkdir -p "$ASTRBOT_ROOT/data"
          python .astrbot/state.py restore

      - name: Render config
        run: python .astrbot/render_config.py

      - name: Run AstrBot (5h30m)
        run: |
          cd "$ASTRBOT_ROOT"
          set +e
          timeout --signal=TERM --kill-after=60 19800 astrbot run
          code=$?
          echo "astrbot exit code: $code"
          exit 0

      - name: Save state
        if: always()
        run: python .astrbot/state.py save
