name: brevo-course-templates

# Временный workflow: создаёт 5 шаблонов email-курса в Brevo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - name: Create course templates
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ["BREVO_API_KEY"]
          sender = {"name": "Travel Finds Deals", "email": "digest@12579258.brevosend.com"}
          templates = [
            ("US Course Day 1 — flexible dates", "The #1 trick that cuts US flight prices", "<p>Hi {{ contact.FIRSTNAME | default: "there" }},</p><p>Most people book a flight for the exact date they want. Airlines know it — and charge for it.</p><p><strong>The trick:</strong> shift your search by ±1–2 days. Tuesday/Wednesday departures are routinely $60–$150 cheaper than Friday/Sunday on the same route.</p><p>Tomorrow: the best booking windows by route.</p><p>— Travel Finds</p>"),
            ("US Course Day 2 — booking windows", "Book 2–4 months ahead (here's the timeline)", "<p>Hi {{ contact.FIRSTNAME | default: "there" }},</p><p><strong>Long-haul international:</strong> 2–4 months before departure. <strong>Domestic US:</strong> 4–8 weeks. <strong>Holidays:</strong> 4–6 months and avoid the exact peak days.</p><p>Tomorrow: mistake fares and error fares.</p><p>— Travel Finds</p>"),
            ("US Course Day 3 — error fares", "How to catch a mistake fare before it disappears", "<p>Hi {{ contact.FIRSTNAME | default: "there" }},</p><p>Sometimes an airline publishes a wrong price — a mistake fare. They usually last 2–12 hours.</p><p>Turn on alerts for your hub, check early morning US time, book directly with the airline when possible, and don't book non-refundable hotels before the ticket is confirmed.</p><p>— Travel Finds</p>"),
            ("US Course Day 4 — secondary airports", "The airport 40 minutes away can save you $200", "<p>Hi {{ contact.FIRSTNAME | default: "there" }},</p><p>Check secondary airports: JFK vs EWR vs PHL, LAX vs BUR vs ONT, SFO vs OAK vs SJC, ORD vs MDW. A positioning flight can beat an expensive direct long-haul — leave 4+ hours of buffer.</p><p>— Travel Finds</p>"),
            ("US Course Day 5 — real trip budget", "Your flight is only 60% of the trip cost", "<p>Hi {{ contact.FIRSTNAME | default: "there" }},</p><p>Budget for baggage, eSIM, transfers and insurance. Every Tuesday I send 5–8 hand-picked fares from US hubs with dates and total price.</p><p>— Travel Finds</p>"),
          ]
          def call(path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request("https://api.brevo.com/v3" + path, data=data, method="POST",
                  headers={"api-key": key, "Content-Type": "application/json", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode()[:300]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]
          for name, subject, html in templates:
              payload = {"templateName": name, "subject": subject, "htmlContent": html, "sender": sender, "isActive": True}
              print(name, "->", *call("/smtp/templates", payload))
          req = urllib.request.Request("https://api.brevo.com/v3/smtp/templates?limit=20",
              headers={"api-key": key, "Accept": "application/json"})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.loads(r.read().decode())
          print("templates:", [(t.get("id"), t.get("name")) for t in data.get("templates", [])])
          PY

