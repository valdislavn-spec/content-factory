name: Fediverse content mix

on:
  schedule:
    # 4 поста в сутки: 10:17, 14:17, 18:17, 22:17 UTC
    - cron: "17 10,14,18,22 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "crypto / ai / travel (пусто = по ротации)"
        required: false
        default: ""

concurrency:
  group: fediverse-mix
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml pillow
      - name: Restore rotation state
        uses: actions/cache@v4
        with:
          path: data/fediverse_mix_state.json
          key: fediverse-mix-state-${{ github.run_id }}
          restore-keys: |
            fediverse-mix-state-
      - name: Post next topic
        env:
          AKKOMA_BASE_URL: ${{ secrets.AKKOMA_BASE_URL }}
          AKKOMA_TOKEN: ${{ secrets.AKKOMA_TOKEN }}
          TRAVEL_AFFILIATE_URL: ${{ secrets.TRAVEL_AFFILIATE_URL }}
          PIXELFED_BASE_URL: ${{ secrets.PIXELFED_BASE_URL }}
          PIXELFED_TOKEN: ${{ secrets.PIXELFED_TOKEN }}
          PIXELFED_MAX_WIDTH: "320"
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          LINK_TRACKER_BASE: ${{ secrets.LINK_TRACKER_BASE }}
          LINK_TRACKER_ADMIN_TOKEN: ${{ secrets.LINK_TRACKER_ADMIN_TOKEN }}
        run: |
          python scripts/fediverse_mix.py --once ${{ github.event.inputs.topic && format('--topic {0}', github.event.inputs.topic) || '' }}
