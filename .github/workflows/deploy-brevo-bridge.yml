name: deploy-brevo-bridge

# Временный workflow: деплой Cloudflare Worker "brevo-bridge" (SMTP->Brevo API).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
    steps:
      - name: Write worker and deploy
        run: |
          cat > worker.mjs <<'EOF'
          export default {
            async fetch(request, env) {
              if (request.method !== "POST") {
                return new Response("method not allowed", { status: 405 });
              }
              if (request.headers.get("x-bridge-token") !== env.BRIDGE_TOKEN) {
                return new Response("unauthorized", { status: 401 });
              }
              let body;
              try { body = await request.json(); } catch (e) {
                return new Response("bad json", { status: 400 });
              }
              const sender = body.sender || {};
              const payload = {
                sender: {
                  name: sender.name || "Travel Finds Deals",
                  email: sender.email || "digest@12579258.brevosend.com",
                },
                to: (body.to || []).map((email) => ({ email })),
                subject: body.subject || "(no subject)",
                htmlContent: body.html || "",
                textContent: body.text || "",
              };
              if (!payload.to.length) {
                return new Response("no recipients", { status: 400 });
              }
              const resp = await fetch("https://api.brevo.com/v3/smtp/email", {
                method: "POST",
                headers: {
                  "api-key": env.BREVO_API_KEY,
                  "content-type": "application/json",
                  "accept": "application/json",
                },
                body: JSON.stringify(payload),
              });
              return new Response(await resp.text(), {
                status: resp.status,
                headers: { "content-type": "application/json" },
              });
            },
          };
          EOF
          echo "worker.mjs written"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/brevo-bridge"             -H "Authorization: Bearer $CF_API_TOKEN"             -F 'metadata={"main_module":"worker.mjs"};type=application/json'             -F 'worker.mjs=@worker.mjs;type=application/javascript+module' | head -c 600
          echo
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/brevo-bridge/secrets"             -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json"             -d "{\"name\":\"BREVO_API_KEY\",\"text\":\"$BREVO_API_KEY\",\"type\":\"secret_text\"}" | head -c 300
          echo
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/brevo-bridge/secrets"             -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json"             -d "{\"name\":\"BRIDGE_TOKEN\",\"text\":\"$BRIDGE_TOKEN\",\"type\":\"secret_text\"}" | head -c 300
          echo
          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT_ID']}/workers/subdomain",
              headers={"Authorization": "Bearer " + os.environ["CF_API_TOKEN"]})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.loads(r.read().decode())
          sub = (data.get("result") or {}).get("subdomain")
          print("WORKER_URL=https://brevo-bridge.%s.workers.dev" % sub)
          PY

