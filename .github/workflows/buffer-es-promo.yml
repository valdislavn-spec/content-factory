name: buffer-es-promo

# 3 posts/week: Mon AI, Wed Crypto, Fri Sports.
# 19:30 UTC = 20:30 Spain (CET/CEST), 15:30 Argentina, 11:30 US Pacific.
on:
  schedule:
    - cron: "30 19 * * 1,3,5"
  workflow_dispatch:
    inputs:
      channel:
        description: "tech-ai-es | crypto-es | futbol-es (empty = auto by weekday)"
        required: false
        default: ""
      variant:
        description: "0..2 (empty = auto by ISO week)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: buffer-es-promo
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_X_CHANNEL_ID: "6951b346457dae6a34bd5e32"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Publish one ES channel promo
        shell: bash
        run: |
          CH="${{ inputs.channel }}"
          VAR="${{ inputs.variant }}"
          if [ -z "$CH" ]; then
            case "$(date -u +%u)" in
              1) CH="tech-ai-es" ;;
              3) CH="crypto-es" ;;
              *) CH="futbol-es" ;;
            esac
          fi
          if [ -z "$VAR" ]; then
            WEEK=$(date -u +%V)
            VAR=$(( (10#$WEEK - 46) % 3 ))
          fi
          echo "channel=$CH variant=$VAR"
          python scripts/buffer_es_channels_promo.py --live --channel "$CH" --variant "$VAR"
