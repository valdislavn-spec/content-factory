name: polymarket-es-morning

# Утренний спортивный дайджест Polymarket для испаноязычной аудитории:
# 14:00 UTC = 15:00 Мадрид / 09:00 Буэнос-Айрес. Канал futbol-es вынесен
# из общей ротации (в config/polymarket.yaml у него fixed_hour_utc: 14).
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "true = публиковать в Telegram, false = только лог"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

concurrency:
  group: polymarket-es-morning
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_FUTBOL_ES: ${{ secrets.TELEGRAM_CHAT_ID_FUTBOL_ES }}
      TELEGRAM_API_BASE: ${{ vars.TELEGRAM_API_BASE }}
      POLYMARKET_AFFILIATE_URL: ${{ secrets.POLYMARKET_AFFILIATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Publish morning sports digest (ES)
        run: |
          LIVE=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then
            LIVE="--live"
          fi
          python scripts/polymarket_digest.py --channel futbol-es $LIVE
