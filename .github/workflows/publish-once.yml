name: publish-once

# Ручная публикация одного поста в выбранный канал (без ожидания слота).
# Запуск: Actions → publish-once → Run workflow → указать channel.
# dry_run=false принудительно: пост уйдёт в Telegram.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "ID канала (например ai-news, tech-news, crypto-news)"
        required: true
        default: "ai-news"
      dry_run:
        description: "true = только в outbox, false = реальная публикация"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_API_BASE: ${{ vars.TELEGRAM_API_BASE }}
      # На раннере доступны OpenAI/Groq/OpenRouter, недоступные из РФ.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      WORLD_NEWS_API_KEY: ${{ secrets.WORLD_NEWS_API_KEY }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      GDELT_CLOUD_API_KEY: ${{ secrets.GDELT_CLOUD_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}
      CONTENT_FACTORY_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Publish one post
        run: |
          python -m content_factory channels
          python -m content_factory run --channel "${{ inputs.channel }}" --publish --max-posts 1
      - name: Upload outbox and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-once-${{ github.run_number }}
          path: |
            data/outbox
            data/logs
          if-no-files-found: ignore
          retention-days: 7
