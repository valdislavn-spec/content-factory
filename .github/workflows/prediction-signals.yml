name: prediction-signals

# Сигналы с прогнозных рынков: Polymarket (осн.), Kalshi/Manifold/Metaculus —
# по мере доступности API. Публикация в SIGNAL CRYPTO по крипто-событиям.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "true = публиковать в канал, false = только лог"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: prediction-signals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_CRYPTO_SIGNALS: ${{ secrets.TELEGRAM_CHAT_ID_CRYPTO_SIGNALS }}
      TELEGRAM_API_BASE: ${{ vars.TELEGRAM_API_BASE }}
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ensure data dir
        run: mkdir -p data
      - name: Restore prediction state
        uses: actions/cache@v4
        with:
          path: data/prediction_state.json
          key: prediction-state-${{ github.run_id }}
          restore-keys: prediction-state-
      - name: Generate prediction signals
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then
            python scripts/prediction_signals.py --publish
          else
            python scripts/prediction_signals.py --dry-run
          fi
