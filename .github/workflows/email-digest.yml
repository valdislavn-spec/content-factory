name: email-digest

# Еженедельный email-дайджест постов контент-фабрики.
# Без SMTP-секретов работает в dry-run и сохраняет .eml артефактом.

on:
  schedule:
    - cron: "17 8 * * 1"   # понедельник 08:17 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим"
        required: true
        default: "dry-run"
        type: choice
        options: ["dry-run", "send"]

permissions:
  contents: read

concurrency:
  group: email-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
      EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT || '587' }}
      EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
      EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_SUBJECT_PREFIX: ${{ vars.EMAIL_SUBJECT_PREFIX || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build/send digest
        run: |
          ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "send" ]; then
            ARG="--send"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ -n "$EMAIL_SMTP_PASSWORD" ]; then
            ARG="--send"
          fi
          python scripts/email_digest.py $ARG --days 7
      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-digest
          path: data/outbox/email
          if-no-files-found: ignore
          retention-days: 14
