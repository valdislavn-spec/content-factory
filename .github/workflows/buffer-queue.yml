name: buffer-queue

# Один раз в день: берём дневной пин, адаптируем под каналы Buffer
# (Bluesky / X / Facebook) и ставим в очередь Buffer.
on:
  schedule:
    - cron: "10 9 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "true = создать посты в Buffer, false = только текст"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      services:
        description: "сети через запятую (пусто = все): twitter,bluesky,facebook"
        required: false
        default: ""
      mode:
        description: "override: addToQueue / shareNow (пусто = из конфига)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Queue daily pin
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.live }}" = "true" ]; then
            python scripts/buffer_queue.py --live --services "${{ inputs.services }}" --mode "${{ inputs.mode }}"
          else
            python scripts/buffer_queue.py
          fi
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: buffer-queue-report
          path: data/reports/buffer-queue-*.json
          if-no-files-found: ignore
