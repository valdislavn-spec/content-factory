name: buffer-queue

# Ежедневно ставит посты в Buffer по НАШЕМУ расписанию: customScheduled на
# слоты из config/buffer.yaml (schedule.times), независимо от Buffer-овского
# queue schedule. Quality-гейт: только курируемые пины, проверка картинки.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "true = создать посты в Buffer, false = только показать план"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: buffer-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ensure data dir
        run: mkdir -p data
      - name: Restore queue state
        uses: actions/cache@v4
        with:
          path: data/buffer_state.json
          key: buffer-state-${{ github.run_id }}
          restore-keys: buffer-state-
      - name: Queue by schedule
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.live }}" = "true" ]; then
            python scripts/buffer_queue.py --schedule --live
          else
            python scripts/buffer_queue.py --schedule
          fi
