name: gemini-check

# Проверка: секрет GEMINI_API_KEY живой, модели доступны, работает и нативная
# generateContent, и OpenAI-совместимый endpoint (его использует контент-завод).
on:
  workflow_dispatch:

concurrency:
  group: gemini-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Gemini API (models, generateContent, openai-compat)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          raw = os.environ.get("GEMINI_API_KEY") or ""
          key = raw.strip()
          print("secret diagnostics: len=%s stripped_len=%s whitespace=%s"
                % (len(raw), len(key), any(ch.isspace() for ch in raw)))
          if not key:
              raise SystemExit("GEMINI_API_KEY secret is empty")

          def call(url, payload=None, timeout=90):
              data = json.dumps(payload).encode() if payload is not None else None
              headers = {"User-Agent": "content-factory-gemini-check"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(url, data=data, headers=headers)
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return json.load(response)

          models = call("https://generativelanguage.googleapis.com/v1beta/models?key=" + key)
          names = [m.get("name", "").split("/")[-1] for m in models.get("models") or []]
          preferred = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.6-flash",
                       "gemini-3.5-flash", "gemini-3.8-flash-lite", "gemini-3.5-flash-lite"]
          candidates = [n for n in preferred if n in names]
          if not candidates:
              candidates = [n for n in names if "flash" in n and "embedding" not in n][:5]
          print("Gemini models OK; candidates:", candidates)

          def native(model):
              url = "https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=%s" % (model, key)
              payload = {"contents": [{"parts": [{"text": "Reply with the single word: OK"}]}]}
              answer = call(url, payload)
              text = (answer.get("candidates", [{}])[0].get("content", {}).get("parts", [{}])[0].get("text", "")).strip()
              if not text:
                  raise RuntimeError("empty native response")
              return text

          def openai_compat(model):
              url = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
              payload = {"model": model, "messages": [{"role": "user", "content": "Reply with the single word: OK"}]}
              headers = {"Authorization": "Bearer " + key, "Content-Type": "application/json"}
              request = urllib.request.Request(url, data=json.dumps(payload).encode(), headers=headers)
              with urllib.request.urlopen(request, timeout=90) as response:
                  answer = json.load(response)
              return (answer.get("choices", [{}])[0].get("message", {}).get("content", "") or "").strip()

          native_ok = None
          for model in candidates:
              for attempt in range(3):
                  try:
                      text = native(model)
                      print("native generateContent OK (%s): %s" % (model, text))
                      native_ok = model
                      break
                  except urllib.error.HTTPError as exc:
                      body = exc.read()[:300].decode("utf-8", "replace")
                      print("native %s attempt %s: HTTP %s %s" % (model, attempt + 1, exc.code, body))
                      time.sleep(2 + attempt * 3)
                  except Exception as exc:  # noqa: BLE001
                      print("native %s attempt %s: %s" % (model, attempt + 1, exc))
                      time.sleep(2 + attempt * 3)
              if native_ok:
                  break
          if not native_ok:
              raise SystemExit("no model answered generateContent")

          compat_ok = None
          for model in [native_ok] + [c for c in candidates if c != native_ok]:
              try:
                  text = openai_compat(model)
                  print("OpenAI-compatible OK (%s): %s" % (model, text))
                  compat_ok = model
                  break
              except urllib.error.HTTPError as exc:
                  body = exc.read()[:300].decode("utf-8", "replace")
                  print("openai-compat %s: HTTP %s %s" % (model, exc.code, body))
              except Exception as exc:  # noqa: BLE001
                  print("openai-compat %s: %s" % (model, exc))
          if not compat_ok:
              raise SystemExit("OpenAI-compatible endpoint failed")

          print("RESULT: key OK, native model=%s, openai-compat model=%s" % (native_ok, compat_ok))
          PY
