name: gemini-check

# Проверка: секрет GEMINI_API_KEY живой, Gemini отвечает и через нативный
# generateContent, и через OpenAI-совместимый endpoint (его использует завод).
on:
  workflow_dispatch:

concurrency:
  group: gemini-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gemini API checks
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          raw = os.environ.get("GEMINI_API_KEY") or ""
          key = raw.strip()
          print("secret diagnostics: len=%s stripped_len=%s whitespace=%s"
                % (len(raw), len(key), any(ch.isspace() for ch in raw)))
          if not key:
              raise SystemExit("GEMINI_API_KEY secret is empty")

          def call(url, payload=None, timeout=25, headers=None):
              data = json.dumps(payload).encode() if payload is not None else None
              hdrs = {"User-Agent": "content-factory-gemini-check"}
              hdrs.update(headers or {})
              if data is not None:
                  hdrs["Content-Type"] = "application/json"
              request = urllib.request.Request(url, data=data, headers=hdrs)
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return json.load(response)

          models = call("https://generativelanguage.googleapis.com/v1beta/models?key=" + key, timeout=30)
          names = [m.get("name", "").split("/")[-1] for m in models.get("models") or []]
          print("models OK:", len(names))
          preferred = ["gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.7-flash",
                       "gemini-3.8-flash", "gemini-3.5-flash-lite"]
          candidates = [n for n in preferred if n in names]
          if not candidates:
              candidates = [n for n in names if "flash" in n and "embedding" not in n][:5]
          print("candidates:", candidates)

          native_model = None
          for model in candidates:
              try:
                  url = ("https://generativelanguage.googleapis.com/v1beta/models/"
                         + model + ":generateContent?key=" + key)
                  answer = call(url, {"contents": [{"parts": [{"text": "Reply with the single word: OK"}]}]}, timeout=30)
                  text = (answer.get("candidates", [{}])[0].get("content", {}).get("parts", [{}])[0].get("text", "")).strip()
                  print("native OK (%s): %s" % (model, text))
                  native_model = model
                  break
              except urllib.error.HTTPError as exc:
                  print("native %s: HTTP %s %s" % (model, exc.code, exc.read()[:200].decode("utf-8", "replace")))
              except Exception as exc:  # noqa: BLE001
                  print("native %s: %s" % (model, exc))
          if not native_model:
              raise SystemExit("native generateContent failed on all candidates")

          compat_model = None
          for model in [native_model] + [c for c in candidates if c != native_model]:
              try:
                  url = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
                  answer = call(
                      url,
                      {"model": model, "messages": [{"role": "user", "content": "Reply with the single word: OK"}]},
                      timeout=30,
                      headers={"Authorization": "Bearer " + key},
                  )
                  text = (answer.get("choices", [{}])[0].get("message", {}).get("content", "") or "").strip()
                  print("openai-compat OK (%s): %s" % (model, text))
                  compat_model = model
                  break
              except urllib.error.HTTPError as exc:
                  print("openai-compat %s: HTTP %s %s" % (model, exc.code, exc.read()[:200].decode("utf-8", "replace")))
              except Exception as exc:  # noqa: BLE001
                  print("openai-compat %s: %s" % (model, exc))
          if not compat_model:
              raise SystemExit("OpenAI-compatible endpoint failed")

          print("RESULT: key OK; native=%s; openai-compat=%s" % (native_model, compat_model))
          PY
