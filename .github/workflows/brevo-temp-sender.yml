name: brevo-temp-sender

# Временный workflow: убрать личный контакт и добавить temp-mail как sender.
on:
  workflow_dispatch:
    inputs:
      temp_email:
        description: "Temp mailbox email (new sender)"
        required: true
        default: "travelfindsdealsskfce@fldubai.com"

permissions:
  contents: read

jobs:
  sender:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - name: Remove owner contact and add temp sender
        env:
          TEMP_EMAIL: ${{ inputs.temp_email }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ["BREVO_API_KEY"]
          temp = os.environ["TEMP_EMAIL"]
          def call(path, method="GET", body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request("https://api.brevo.com/v3" + path, data=data, method=method,
                  headers={"api-key": key, "Content-Type": "application/json", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read().decode()
                      return r.status, raw[:600]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:600]
          print("delete owner contact:", *call("/contacts/1", method="DELETE"))
          print("add sender:", *call("/senders", "POST", {"email": temp, "name": "Travel Finds Deals"}))
          print("senders:", *call("/senders"))
          PY

