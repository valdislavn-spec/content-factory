name: export-secret

on:
  workflow_dispatch:
    inputs:
      public_key_b64:
        description: "RSA public key (base64 PEM)"
        required: true

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - name: Encrypt secret
        env:
          PUB_B64: ${{ inputs.public_key_b64 }}
        run: |
          echo "$PUB_B64" | base64 -d > pub.pem
          printf '%s' "$BREVO_API_KEY" | openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0 > ct.b64
          echo "CIPHER_TEXT:$(cat ct.b64)"
