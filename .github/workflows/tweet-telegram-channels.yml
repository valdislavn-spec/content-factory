name: tweet-telegram-channels

on:
  workflow_dispatch:

concurrency:
  group: tweet-telegram-channels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCOUNT_BLOB: ${{ secrets.X_ACCOUNT_BLOB }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Diagnose X credentials
        continue-on-error: true
        run: python3 scripts/x_diag.py
      - name: Post tweet
        run: python3 scripts/post_telegram_channels_tweet.py
      - name: Save marker and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth-funnel/x-debug.json growth-funnel/x-post-debug.json || true
          if [ -f growth-funnel/.tweeted-telegram-channels ]; then
            git add growth-funnel/.tweeted-telegram-channels
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: x tweet debug [skip ci]"
          git push
