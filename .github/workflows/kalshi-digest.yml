name: kalshi-digest

# Публичные данные Kalshi (без API-ключа). Дайджесты самых ликвидных рынков
# в каналы: crypto-news, sport-news, ai-news. По расписанию — live,
# вручную — dry-run по умолчанию.

on:
  schedule:
    - cron: "15 12,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = только лог, false = публикация"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      discover:
        description: "категория серий для просмотра (пусто = обычный дайджест)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_API_BASE: ${{ vars.TELEGRAM_API_BASE }}
      TELEGRAM_CHAT_ID_TECH_AI_ES: ${{ secrets.TELEGRAM_CHAT_ID_TECH_AI_ES }}
      TELEGRAM_CHAT_ID_CRYPTO_ES: ${{ secrets.TELEGRAM_CHAT_ID_CRYPTO_ES }}
      TELEGRAM_CHAT_ID_FUTBOL_ES: ${{ secrets.TELEGRAM_CHAT_ID_FUTBOL_ES }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Kalshi digest
        run: |
          if [ -n "${{ inputs.discover }}" ]; then
            python scripts/kalshi_digest.py --discover "${{ inputs.discover }}"
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.dry_run }}" = "false" ]; then
            python scripts/kalshi_digest.py --live
          else
            python scripts/kalshi_digest.py
          fi
