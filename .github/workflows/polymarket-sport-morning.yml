name: polymarket-sport-morning

# Утренний спортивный дайджест Polymarket для US-аудитории:
# 13:00 UTC = 08:00 ET / 05:00 PT. Канал sport-news вынесен из общей
# ротации (в config/polymarket.yaml у него fixed_hour_utc: 13).
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "true = публиковать в Telegram, false = только лог"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

concurrency:
  group: polymarket-sport-morning
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_SPORT_NEWS: ${{ secrets.TELEGRAM_CHAT_ID_SPORT_NEWS }}
      TELEGRAM_API_BASE: ${{ vars.TELEGRAM_API_BASE }}
      POLYMARKET_AFFILIATE_URL: ${{ secrets.POLYMARKET_AFFILIATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Publish morning sports digest
        run: |
          LIVE=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then
            LIVE="--live"
          fi
          python scripts/polymarket_digest.py --channel sport-news $LIVE
