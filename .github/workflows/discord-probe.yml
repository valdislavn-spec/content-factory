name: discord-probe

# Проверка Discord-webhook: отправляет тестовое сообщение и удаляет его.
on:
  workflow_dispatch:
    inputs:
      keep:
        description: "Оставить сообщение"
        type: boolean
        default: false
      sample:
        description: "Отправить образец форматированного поста"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send test message
        run: |
          ARGS=""
          if [ "${{ inputs.keep }}" = "true" ]; then ARGS="$ARGS --keep"; fi
          if [ "${{ inputs.sample }}" = "true" ]; then ARGS="$ARGS --sample"; fi
          python scripts/discord_probe.py $ARGS
