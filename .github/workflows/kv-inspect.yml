name: kv-inspect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUBSCRIBE_KV_NAMESPACE: 422c94623a2a4b88941bd86178429ba8
    steps:
      - name: Inspect KV values
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse
          account = os.environ["CF_ACCOUNT_ID"]; token = os.environ["CF_API_TOKEN"]; ns = os.environ["SUBSCRIBE_KV_NAMESPACE"]
          base = f"https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/{ns}"
          def call(url):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]
          status, data = call(base + "/keys?limit=10")
          keys = [x.get("name","") for x in (data.get("result") or [])]
          print("KV keys:", len(keys))
          for key in keys:
              status, data = call(base + "/values/" + urllib.parse.quote(key))
              if isinstance(data, dict):
                  value = data
              else:
                  try: value = json.loads(data)
                  except Exception: value = str(data)[:200]
              email = key[4:] if key.startswith("sub:") else key
              masked = email.split("@")[0][:2] + "***@" + email.split("@")[-1] if "@" in email else email
              if isinstance(value, dict):
                  print("KEY:", masked, "| fields:", sorted(value.keys()), "| language:", value.get("language"), "| topics:", value.get("topics"), "| source:", value.get("source"), "| consent_at:", value.get("consent_at") or value.get("consentAt"))
              else:
                  print("KEY:", masked, "| raw:", str(value)[:160])
          PY

