name: Mastodon growth

on:
  workflow_dispatch:

concurrency:
  group: mastodon-growth
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml
      - name: Restore growth state
        uses: actions/cache@v4
        with:
          path: data/mastodon_growth_state.json
          key: mastodon-growth-state-${{ github.run_id }}
          restore-keys: |
            mastodon-growth-state-
      - name: Follow + tags + boosts
        env:
          MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: python scripts/mastodon_growth.py --all
