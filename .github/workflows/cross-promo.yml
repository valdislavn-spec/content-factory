name: cross-promo

# Нативные кросс-промо-посты между каналами сети (Вт/Пт).
# Цель и текст выбираются ротацией по дню UTC — состояние не нужно.
on:
  schedule:
    - cron: "0 15 * * 2,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = только показать текст, не публиковать"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

jobs:
  promo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_API_BASE: ${{ vars.TELEGRAM_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Publish cross-promo post
        run: |
          flags=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then flags="--dry-run"; fi
          python scripts/cross_promo.py $flags
