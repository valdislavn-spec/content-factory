name: brevo-update-sender

# Временный workflow: переименовать отправителя, удалить лишнего, отправить тест.
on:
  workflow_dispatch:
    inputs:
      to:
        description: "Test recipient"
        required: true
        default: "travelfindsdealsskfce@fldubai.com"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - name: Update sender and send test
        env:
          TO: ${{ inputs.to }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ["BREVO_API_KEY"]
          to = os.environ["TO"]

          def call(path, method="GET", body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request("https://api.brevo.com/v3" + path, data=data, method=method,
                  headers={"api-key": key, "Content-Type": "application/json", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read().decode()
                      return r.status, (raw if raw else "<empty>")[:500]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:500]

          print("PUT sender 1:", *call("/senders/1", "PUT", {"email": "valdislav.n@gmail.com", "name": "Travel Finds Deals"}))
          print("DELETE sender 3:", *call("/senders/3", "DELETE"))
          payload = {
              "sender": {"name": "Travel Finds Deals", "email": "valdislav.n@gmail.com"},
              "replyTo": {"email": "valdislav.n@gmail.com", "name": "Travel Finds Deals"},
              "to": [{"email": to}],
              "subject": "Travel Finds Deals — sender check",
              "textContent": "From name check. Reply-To check. Affiliate links will be disclosed.",
          }
          print("SEND:", *call("/smtp/email", "POST", payload))
          print("GET senders:", *call("/senders"))
          PY

