name: polymarket-digest

# Дайджест прогнозных рынков Polymarket: один пост каждые 2 часа, каналы
# идут по кругу (crypto-news → sport-news → crypto-es → futbol-es).
# Публичный API, ключей не нужно. Партнёрская ссылка — Secret
# POLYMARKET_AFFILIATE_URL (без него пост выходит без рекламной строки).
on:
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "канал (пусто = по ротации)"
        required: false
        default: ""
      publish:
        description: "true = публиковать в Telegram, false = только лог"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: polymarket-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_CRYPTO_NEWS: ${{ secrets.TELEGRAM_CHAT_ID_CRYPTO_NEWS }}
      TELEGRAM_CHAT_ID_AI_NEWS: ${{ secrets.TELEGRAM_CHAT_ID_AI_NEWS }}
      TELEGRAM_CHAT_ID_SPORT_NEWS: ${{ secrets.TELEGRAM_CHAT_ID_SPORT_NEWS }}
      TELEGRAM_CHAT_ID_CRYPTO_ES: ${{ secrets.TELEGRAM_CHAT_ID_CRYPTO_ES }}
      TELEGRAM_CHAT_ID_FUTBOL_ES: ${{ secrets.TELEGRAM_CHAT_ID_FUTBOL_ES }}
      TELEGRAM_API_BASE: ${{ vars.TELEGRAM_API_BASE }}
      POLYMARKET_AFFILIATE_URL: ${{ secrets.POLYMARKET_AFFILIATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Publish Polymarket digest
        run: |
          LIVE=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then
            LIVE="--live"
          fi
          if [ -n "${{ inputs.channel }}" ]; then
            python scripts/polymarket_digest.py --channel "${{ inputs.channel }}" $LIVE
          else
            python scripts/polymarket_digest.py --rotate $LIVE
          fi
