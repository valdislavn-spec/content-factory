name: cron-ping

# Диагностика: проверяет, доходят ли scheduled-запуски GitHub Actions.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        run: echo "scheduled ping $(date -u)"
