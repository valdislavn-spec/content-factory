name: deploy-surge

# Publishes the "Незабываемое путешествие" landing to
# https://nezabyvaemoe.surge.sh (free surge.sh subdomain, no github.io host).
on:
  push:
    branches: [main]
    paths:
      - "docs/nezabyvaemoe-puteshestvie/**"
      - ".github/workflows/deploy-surge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Publish to surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          npx --yes surge@0.57.0 ./docs/nezabyvaemoe-puteshestvie nezabyvaemoe.surge.sh
      - name: Summary
        run: echo "https://nezabyvaemoe.surge.sh/" >> "$GITHUB_STEP_SUMMARY"
