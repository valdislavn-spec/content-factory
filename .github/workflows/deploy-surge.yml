name: deploy-surge

# Publishes the English "Travel Finds" site (docs/travel-finds) to
# https://travel-finds.surge.sh and keeps the old address alive as a redirect
# (docs/landing-redirect -> nezabyvaemoe.surge.sh).
on:
  push:
    branches: [main]
    paths:
      - "docs/travel-finds/**"
      - "docs/landing-redirect/**"
      - ".github/workflows/deploy-surge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Publish site to travel-finds.surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          npx --yes surge@0.57.0 ./docs/travel-finds travel-finds.surge.sh
      - name: Publish redirect to nezabyvaemoe.surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          npx --yes surge@0.57.0 ./docs/landing-redirect nezabyvaemoe.surge.sh
      - name: Purge Surge edge cache
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          npx --yes surge@0.57.0 bust travel-finds.surge.sh || true
          npx --yes surge@0.57.0 travel-finds.surge.sh bust || true
          npx --yes surge@0.57.0 travel-finds.surge.sh debug bust || true
          npx --yes surge@0.57.0 cutover travel-finds.surge.sh || true
          npx --yes surge@0.57.0 bust travel-finds.surge.sh || true
          npx --yes surge@0.57.0 bust nezabyvaemoe.surge.sh || true
      - name: Summary
        run: |
          echo "https://travel-finds.surge.sh/" >> "$GITHUB_STEP_SUMMARY"
          echo "(old: https://nezabyvaemoe.surge.sh/ -> redirect)" >> "$GITHUB_STEP_SUMMARY"
