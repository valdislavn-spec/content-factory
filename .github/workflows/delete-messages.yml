name: delete-messages

# Ручное удаление сообщений (дублей) из каналов через Bot API deleteMessage.
# Вход: JSON-массив [{"chat_id":"-100...","message_id":123}, ...].
on:
  workflow_dispatch:
    inputs:
      messages:
        description: 'JSON: [{"chat_id":"-100...","message_id":123}]'
        required: true

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_API_BASE: ${{ vars.TELEGRAM_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Delete messages
        run: |
          python scripts/telegram_delete_messages.py --json '${{ inputs.messages }}'
