name: brevo-shared-sender

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sender:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - name: Try sender on Brevo shared domain
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ["BREVO_API_KEY"]
          def call(path, method="GET", body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request("https://api.brevo.com/v3" + path, data=data, method=method,
                  headers={"api-key": key, "Content-Type": "application/json", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read().decode()
                      return r.status, raw[:700]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:700]
          for email in ("digest@12579258.brevosend.com", "deals@12579258.brevosend.com"):
              print("add", email, *call("/senders", "POST", {"email": email, "name": "Travel Finds Deals"}))
          print("senders:", *call("/senders"))
          print("account:", *call("/account"))
          PY

