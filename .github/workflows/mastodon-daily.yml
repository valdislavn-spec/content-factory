name: mastodon-daily

# Один длинный обзор (thread) в Mastodon в день: AI → Crypto → Sports по кругу.
# Триггеры: ежедневный cron + ручной запуск (dry-run по умолчанию).
# Второй пост в день: добавить cron "17 19 * * *" и передать --slot 1.

on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC = 16:17 MSK
  workflow_dispatch:
    inputs:
      publish:
        description: "Режим запуска"
        required: true
        default: "dry-run"
        type: choice
        options: ["dry-run", "live"]

permissions:
  contents: read

concurrency:
  group: mastodon-daily
  cancel-in-progress: false

jobs:
  thread:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Moscow
      MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
      MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
      MASTODON_NO_LINKS: ${{ vars.MASTODON_NO_LINKS || '0' }}
      ALERT_GITHUB_TOKEN: ${{ secrets.ALERT_GITHUB_TOKEN }}
      # LLM-провайдеры
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
      YANDEXGPT_API_KEY: ${{ secrets.YANDEXGPT_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
      OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
      DIFY_BASE_URL: ${{ secrets.DIFY_BASE_URL }}
      DIFY_POSTS_API_KEY: ${{ secrets.DIFY_POSTS_API_KEY }}
      DIFY_NEWS_API_KEY: ${{ secrets.DIFY_NEWS_API_KEY }}
      DIFY_TRENDS_API_KEY: ${{ secrets.DIFY_TRENDS_API_KEY }}
      DIFY_SEO_API_KEY: ${{ secrets.DIFY_SEO_API_KEY }}
      # Источники новостей
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      GDELT_CLOUD_API_KEY: ${{ secrets.GDELT_CLOUD_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      WORLD_NEWS_API_KEY: ${{ secrets.WORLD_NEWS_API_KEY }}
      APITUBE_API_KEY: ${{ secrets.APITUBE_API_KEY }}
      TRENDS_API_KEY: ${{ secrets.TRENDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Publish daily long-form thread
        run: |
          FLAG="--dry-run"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "live" ]; then
            FLAG=""
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            FLAG=""
          fi
          python scripts/mastodon_daily.py $FLAG --slot 0
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mastodon-daily-logs
          path: data/logs
          if-no-files-found: ignore
          retention-days: 7
