name: cf-script-subdomain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Enable workers.dev subdomain
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          account = os.environ["CF_ACCOUNT_ID"]
          token = os.environ["CF_API_TOKEN"]

          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/accounts/{account}{path}",
                  data=data, method=method,
                  headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode()[:700]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:700]

          print("account subdomain:", *call("GET", "/workers/subdomain"))
          print("script subdomain before:", *call("GET", "/workers/scripts/brevo-bridge/subdomain"))
          print("enable:", *call("PUT", "/workers/scripts/brevo-bridge/subdomain", {"enabled": True}))
          print("script subdomain after:", *call("GET", "/workers/scripts/brevo-bridge/subdomain"))
          PY

