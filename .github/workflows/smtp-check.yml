name: smtp-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - name: Test Brevo SMTP auth with API key
        run: |
          python3 - <<'PY'
          import os, smtplib
          host = "smtp-relay.brevo.com"
          user = "bff1ba001@smtp-brevo.com"
          password = os.environ["BREVO_API_KEY"]
          try:
              with smtplib.SMTP(host, 587, timeout=30) as smtp:
                  smtp.starttls()
                  smtp.login(user, password)
                  print("SMTP AUTH: OK")
                  code, _ = smtp.ehlo()
                  print("EHLO:", code)
          except Exception as exc:
              print("SMTP AUTH FAILED:", type(exc).__name__, str(exc)[:200])
          PY

