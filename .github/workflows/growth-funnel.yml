name: growth-funnel

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      execute:
        description: "true = публиковать, false = только показать план"
        required: true
        default: true
        type: boolean

concurrency:
  group: growth-funnel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_API_BASE: ${{ vars.TELEGRAM_API_BASE }}
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
      PINTEREST_API_BASE: ${{ vars.PINTEREST_API_BASE }}
      PINTEREST_BOARD_ID_BUDGET_TRAVEL: ${{ secrets.PINTEREST_BOARD_ID_BUDGET_TRAVEL }}
      PINTEREST_BOARD_ID_CITY_BREAKS: ${{ secrets.PINTEREST_BOARD_ID_CITY_BREAKS }}
      PINTEREST_BOARD_ID_TRAVEL_IDEAS: ${{ secrets.PINTEREST_BOARD_ID_TRAVEL_IDEAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore queue state
        uses: actions/cache/restore@v4
        with:
          path: growth-funnel/queue.json
          key: growth-funnel-queue-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            growth-funnel-queue-
      - name: Publish due items
        run: |
          if [ "${{ inputs.execute }}" = "false" ]; then
            python3 growth-funnel/auto_publish.py --json
          else
            python3 growth-funnel/auto_publish.py --execute --limit-per-platform 1 --json
          fi
      - name: Save queue state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: growth-funnel/queue.json
          key: growth-funnel-queue-${{ github.run_id }}-${{ github.run_attempt }}
