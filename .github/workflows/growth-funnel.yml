name: growth-funnel

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "true = публиковать, false = только показать план"
        required: false
        default: true
        type: boolean

concurrency:
  group: growth-funnel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_API_BASE: https://telegram-proxy.valdislav-n.workers.dev
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
      PINTEREST_API_BASE: ${{ vars.PINTEREST_API_BASE }}
      PINTEREST_BOARD_ID_BUDGET_TRAVEL: ${{ secrets.PINTEREST_BOARD_ID_BUDGET_TRAVEL }}
      PINTEREST_BOARD_ID_CITY_BREAKS: ${{ secrets.PINTEREST_BOARD_ID_CITY_BREAKS }}
      PINTEREST_BOARD_ID_TRAVEL_IDEAS: ${{ secrets.PINTEREST_BOARD_ID_TRAVEL_IDEAS }}
      GROWTH_QUEUE_URL: https://links-tracker.valdislav-n.workers.dev/admin/queue
      GROWTH_QUEUE_TOKEN: ${{ secrets.LINK_TRACKER_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish due items (durable D1 queue)
        run: |
          if [ "${{ inputs.execute }}" = "false" ]; then
            python3 growth-funnel/auto_publish.py --platforms telegram --json
          else
            python3 growth-funnel/auto_publish.py --platforms telegram --execute --limit-per-platform 1 --json
          fi
