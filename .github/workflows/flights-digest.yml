name: flights-digest

# Ежедневная страница дешёвых билетов (Aviasales data API) на хабе.
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      TRAVELPAYOUTS_MARKER: "674170"
      TRAVELPAYOUTS_TRS: "597672"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build flights page
        run: python scripts/flights_digest.py --origin MOW --top 12
      - name: Commit page
        run: |
          if git diff --quiet docs/flights data/flights; then
            echo "no changes"
            exit 0
          fi
          git config user.name "dsh-agent"
          git config user.email "dsh-agent@users.noreply.github.com"
          git add docs/flights data/flights
          git commit -m "chore(flights): daily cheap flights digest"
          git push
