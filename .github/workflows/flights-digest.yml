name: flights-digest

# Ежедневная страница дешёвых билетов (Aviasales data API) на хабе.
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      APILAYER_KEY: ${{ secrets.APILAYER_KEY }}
      TRAVELPAYOUTS_MARKER: "674170"
      TRAVELPAYOUTS_TRS: "597672"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_TRAVEL: ${{ secrets.TELEGRAM_CHAT_ID_TRAVEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build flights pages
        run: |
          python scripts/flights_digest.py --origin ALA --top 12 --notify
          python scripts/flights_digest.py --origin MSQ --top 12 --notify
      - name: Commit page
        run: |
          git config user.name "dsh-agent"
          git config user.email "dsh-agent@users.noreply.github.com"
          git add docs/flights
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(flights): daily cheap flights digest"
          git pull --rebase origin main || true
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            sleep 5
            git pull --rebase origin main || true
          done
          echo "push failed after retries"
          exit 1
