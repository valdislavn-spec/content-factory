name: heartbeat

# Ежедневный heartbeat + разовый тест уведомлений.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
      ALERT_GITHUB_TOKEN: ${{ secrets.ALERT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Важно: список путей должен совпадать с content-factory.yml — от него
      # зависит версия кэша, иначе restore-keys cf-state- не находит запись.
      - name: Restore LLM usage state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/factory.sqlite3
            data/schedule_state.json
            data/schedule_state_es.json
            data/llm_cache.sqlite3
            data/llm_tokens.json
            data/llm_usage.json
            data/llm_usage_*.json
            data/source_*_usage.json
          key: heartbeat-llm-${{ github.run_id }}
          restore-keys: |
            cf-state-
      - name: Send heartbeat
        run: python scripts/heartbeat.py
