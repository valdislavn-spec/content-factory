name: cf-worker-secrets

# Временный workflow: прописать Brevo-секреты в Cloudflare Worker cf-subscribe
# и проверить, что подписка с формы синхронизируется в Brevo.
on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Тестовый email для проверки синхронизации"
        required: true
        default: "travelfindsdealsskfce@fldubai.com"

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_LIST_ID_EN: ${{ secrets.BREVO_LIST_ID_EN }}
      BREVO_LIST_ID_ES: ${{ secrets.BREVO_LIST_ID_ES }}
    steps:
      - name: Set Worker secrets and test subscribe
        env:
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          account = os.environ["CF_ACCOUNT_ID"]
          cf_token = os.environ["CF_API_TOKEN"]
          brevo_key = os.environ["BREVO_API_KEY"]
          script = "cf-subscribe"

          def cf(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{script}{path}",
                  data=data, method=method,
                  headers={"Authorization": "Bearer " + cf_token, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode()[:400]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:400]

          for name, value in (
              ("BREVO_API_KEY", brevo_key),
              ("BREVO_LIST_ID_EN", os.environ["BREVO_LIST_ID_EN"]),
              ("BREVO_LIST_ID_ES", os.environ["BREVO_LIST_ID_ES"]),
          ):
              print("secret", name, *cf("PUT", "/secrets", {"name": name, "text": value, "type": "secret_text"}))
          time.sleep(5)

          email = os.environ["TEST_EMAIL"]
          subscribe = urllib.request.Request(
              "https://cf-subscribe.valdislav-n.workers.dev/",
              data=json.dumps({"email": email, "language": "en", "topics": ["crypto"], "consent": True}).encode(),
              headers={"Content-Type": "application/json", "Origin": "https://valdislavn-spec.github.io",
                       "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36"},
              method="POST")
          with urllib.request.urlopen(subscribe, timeout=30) as r:
              print("subscribe:", r.status, r.read().decode()[:300])
          time.sleep(4)

          req = urllib.request.Request("https://api.brevo.com/v3/contacts/" + email,
              headers={"api-key": brevo_key, "Accept": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("brevo contact FOUND:", r.status, r.read().decode()[:400])
                  synced = True
          except urllib.error.HTTPError as e:
              print("brevo contact NOT synced:", e.code, e.read().decode()[:200])
              synced = False
          if synced:
              delete = urllib.request.Request("https://api.brevo.com/v3/contacts/" + email,
                  method="DELETE", headers={"api-key": brevo_key, "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(delete, timeout=30) as r:
                      print("cleanup brevo contact:", r.status)
              except urllib.error.HTTPError as e:
                  print("cleanup brevo error:", e.code)
          kv_delete = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/{os.environ.get('SUBSCRIBE_KV_NAMESPACE','422c94623a2a4b88941bd86178429ba8')}/values/sub:" + email,
              method="DELETE", headers={"Authorization": "Bearer " + cf_token})
          try:
              with urllib.request.urlopen(kv_delete, timeout=30) as r:
                  print("cleanup KV:", r.status)
          except urllib.error.HTTPError as e:
              print("cleanup KV error:", e.code)
          PY

