name: travel-collections

# Публикация подборок в канал «Путешествия» (@GOODTRAVEL007).
# Запуск вручную: можно выбрать язык, одну подборку или проверку без отправки.
on:
  schedule:
    # Каждые 12 часов: 00:00 и 12:00 UTC — одна подборка по кругу.
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      lang:
        description: "Язык набора"
        type: choice
        default: ru
        options: [ru, en]
      slug:
        description: "Одна подборка (пусто = все)"
        default: ""
      dry_run:
        description: "Проверка без отправки"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_TRAVEL: ${{ secrets.TELEGRAM_CHAT_ID_TRAVEL }}
      GA4_MEASUREMENT_ID: "G-LC39S1FD7B"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and publish
        run: |
          set -e
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/flights_collections.py --lang ru --publish --rotate
          else
            ARGS="--lang ${{ inputs.lang }}"
            if [ -n "${{ inputs.slug }}" ]; then ARGS="$ARGS --only ${{ inputs.slug }}"; fi
            if [ "${{ inputs.dry_run }}" != "true" ]; then ARGS="$ARGS --publish"; fi
            python scripts/flights_collections.py $ARGS
          fi
      - name: Commit refreshed pages
        run: |
          git config user.name "dsh-agent"
          git config user.email "dsh-agent@users.noreply.github.com"
          git add docs/collections docs/sitemap.xml
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(collections): refresh after publish"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
