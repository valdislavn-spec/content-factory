name: brevo-campaign-debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_LIST_ID_EN: ${{ secrets.BREVO_LIST_ID_EN }}
    steps:
      - name: Try campaign payloads
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ["BREVO_API_KEY"]
          list_id = int(os.environ["BREVO_LIST_ID_EN"])

          def call(path, body=None, method="POST"):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request("https://api.brevo.com/v3" + path, data=data, method=method,
                  headers={"api-key": key, "Content-Type": "application/json", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode()[:800]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:800]

          base = {
              "name": "debug-campaign",
              "sender": {"name": "Travel Finds Deals", "email": "valdislav.n@gmail.com"},
              "subject": "Debug subject",
              "htmlContent": "<html><body><p>Debug campaign</p></body></html>",
              "recipients": {"listIds": [list_id]},
          }
          variants = {
              "minimal": base,
              "with_reply": {**base, "replyTo": {"email": "valdislav.n@gmail.com", "name": "Travel Finds Deals"}},
              "full": {**base, "replyTo": {"email": "valdislav.n@gmail.com"}, "type": "classic",
                       "scheduledAt": "2026-11-10T18:30:00Z", "tag": "debug"},
          }
          for name, payload in variants.items():
              print(name, "->", *call("/emailCampaigns", payload))
          print("accounts:", *call("/account", method="GET"))
          print("lists:", *call("/contacts/lists?limit=10", method="GET"))
          PY

