name: x-oauth2-refresh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X_OAUTH2_CLIENT_ID: ${{ secrets.X_OAUTH2_CLIENT_ID }}
      X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
      X_OAUTH2_CLIENT_SECRET_ALT: ${{ secrets.X_OAUTH2_CLIENT_SECRET_ALT }}
      X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
      GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
    steps:
      - name: Refresh OAuth2 token and persist secrets
        run: |
          python - <<'PY'
          import os, json, base64, urllib.parse, urllib.request, urllib.error
          from nacl import encoding, public

          cid = os.environ["X_OAUTH2_CLIENT_ID"].strip()
          refresh = os.environ["X_OAUTH2_REFRESH_TOKEN"].strip()
          candidates = []
          for name in ("X_OAUTH2_CLIENT_SECRET", "X_OAUTH2_CLIENT_SECRET_ALT"):
              value = os.environ.get(name, "").strip()
              if value and value not in candidates:
                  candidates.append((name, value))

          def token_request(secret):
              basic = base64.b64encode((cid + ":" + secret).encode()).decode()
              form = urllib.parse.urlencode({
                  "grant_type": "refresh_token",
                  "refresh_token": refresh,
              }).encode()
              req = urllib.request.Request(
                  "https://api.x.com/2/oauth2/token",
                  data=form, method="POST",
                  headers={"Authorization": "Basic " + basic,
                           "Content-Type": "application/x-www-form-urlencoded",
                           "User-Agent": "content-factory-x-oauth2-refresh"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.loads(response.read())
              except urllib.error.HTTPError as error:
                  try:
                      body = json.loads(error.read())
                  except Exception:
                      body = {}
                  return error.code, body

          winner = None
          tokens = None
          for name, secret in candidates:
              status, body = token_request(secret)
              print("candidate", name, "HTTP", status, "| error:", body.get("error"), "| scope:", body.get("scope"))
              if status == 200 and body.get("access_token"):
                  winner = name
                  tokens = body
                  break
              if status == 400 and body.get("error") == "invalid_client":
                  continue
              break

          if not tokens:
              raise SystemExit("refresh failed: no candidate secret worked")

          repo = "valdislavn-spec/content-factory"
          gh = os.environ["GH_SECRETS_TOKEN"].strip()
          headers = {"Authorization": "Bearer " + gh,
                     "Accept": "application/vnd.github+json",
                     "User-Agent": "content-factory-x-oauth2-refresh",
                     "Content-Type": "application/json"}
          with urllib.request.urlopen(urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/secrets/public-key",
                  headers=headers), timeout=20) as response:
              pk = json.loads(response.read())
          box = public.SealedBox(public.PublicKey(pk["key"].encode(), encoding.Base64Encoder()))
          updates = {
              "X_OAUTH2_ACCESS_TOKEN": tokens["access_token"],
              "X_OAUTH2_REFRESH_TOKEN": tokens["refresh_token"],
          }
          if winner == "X_OAUTH2_CLIENT_SECRET_ALT":
              updates["X_OAUTH2_CLIENT_SECRET"] = os.environ["X_OAUTH2_CLIENT_SECRET_ALT"].strip()
          for name, value in updates.items():
              encrypted = base64.b64encode(box.encrypt(value.encode())).decode()
              body = json.dumps({"encrypted_value": encrypted, "key_id": pk["key_id"]}).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/secrets/{name}",
                  data=body, method="PUT", headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  print("updated secret", name, response.status)
          print("SUCCESS scope:", tokens.get("scope"), "| expires_in:", tokens.get("expires_in"), "| winner:", winner)
          PY
