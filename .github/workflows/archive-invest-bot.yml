name: archive-invest-bot-status

on:
  schedule:
    # every 30 min, Mon-Fri, 06:00-16:30 UTC (09:00-19:30 MSK)
    - cron: "*/30 6-16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: invest-bot-monitor
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch status and rebuild report
        working-directory: invest-bot
        run: python -m bot.monitor --once --append --report MONITORING.md

      - name: Commit if changed
        run: |
          git config user.name "invest-bot-archive"
          git config user.email "actions@users.noreply.github.com"
          git add -f invest-bot/data/automation invest-bot/MONITORING.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(invest-bot): monitor snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
