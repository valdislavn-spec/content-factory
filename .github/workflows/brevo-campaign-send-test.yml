name: brevo-campaign-send-test

on:
  workflow_dispatch:
    inputs:
      temp_email:
        description: "Temp mailbox to add to EN list"
        required: true
        default: "travelfindsdealsskfce@fldubai.com"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_LIST_ID_EN: ${{ secrets.BREVO_LIST_ID_EN }}
    steps:
      - name: Cleanup, inspect contact, test campaign send
        env:
          TEMP_EMAIL: ${{ inputs.temp_email }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          key = os.environ["BREVO_API_KEY"]
          list_id = int(os.environ["BREVO_LIST_ID_EN"])
          temp_email = os.environ["TEMP_EMAIL"]

          def call(path, method="POST", body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request("https://api.brevo.com/v3" + path, data=data, method=method,
                  headers={"api-key": key, "Content-Type": "application/json", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read().decode()
                      return r.status, raw[:700]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:700]

          print("delete debug campaign 1:", *call("/emailCampaigns/1", method="DELETE"))
          print("owner contact:", *call("/contacts/valdislav.n@gmail.com", method="GET"))
          print("add temp contact:", *call("/contacts", body={"email": temp_email, "listIds": [list_id], "updateEnabled": True}))
          print("list state:", *call(f"/contacts/lists/{list_id}", method="GET"))
          payload = {
              "name": "sender delivery test",
              "sender": {"name": "Travel Finds Deals", "email": "valdislav.n@gmail.com"},
              "subject": "Travel Finds Deals — campaign delivery test",
              "htmlContent": "<html><body><p>Campaign delivery test.</p></body></html>",
              "recipients": {"listIds": [list_id]},
          }
          status, body = call("/emailCampaigns", body=payload)
          print("create campaign:", status, body)
          if status == 201:
              campaign_id = json.loads(body)["id"]
              print("send campaign:", *call(f"/emailCampaigns/{campaign_id}/send"))
              time.sleep(3)
              print("campaign state:", *call(f"/emailCampaigns/{campaign_id}", method="GET"))
          PY

