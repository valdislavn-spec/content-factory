name: source-check

# Проверка RSS-источников из облака: доступность и число материалов.
# Actions → source-check → Run workflow (можно передать свои адреса).

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Свои адреса через запятую (пусто = все из конфигов)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check feeds
        run: |
          if [ -n "${{ inputs.urls }}" ]; then
            ARGS=""
            IFS=',' read -ra LIST <<< "${{ inputs.urls }}"
            for u in "${LIST[@]}"; do ARGS="$ARGS --url $(echo $u | xargs)"; done
            python scripts/check_sources.py $ARGS
          else
            python scripts/check_sources.py
          fi
