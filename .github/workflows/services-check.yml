name: services-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brevo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/brevo_check.py

  pinterest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
      PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID }}
      PINTEREST_IMAGE_URL: ${{ vars.PINTEREST_IMAGE_URL }}
      PINTEREST_API_BASE: ${{ vars.PINTEREST_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/pinterest_check.py

  x:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      X_ACCOUNT_BLOB: ${{ secrets.X_ACCOUNT_BLOB }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/x_check.py

  buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify Buffer API
        run: |
          python - <<'PY'
          from content_factory.integrations.buffer import BufferClient
          client = BufferClient.from_env()
          orgs = client.organizations()
          print("organizations:", [(o.get("id"), o.get("name")) for o in orgs])
          if not orgs:
              raise SystemExit("Buffer: organizations пуст")
          channels = client.channels(orgs[0]["id"])
          print("channels:", [(c.get("service"), c.get("name"), c.get("id")) for c in channels])
          PY
      - run: python scripts/buffer_queue.py --services twitter,bluesky,facebook

  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LINK_TRACKER_BASE: ${{ secrets.LINK_TRACKER_BASE }}
    steps:
      - name: Probe Cloudflare APIs
        run: |
          check() {
            name="$1"; shift
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$@") || true
            echo "$name: $code"
            test "$code" = "200"
          }
          check "cloudflare token" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"
          check "price alerts" "https://price-alerts.valdislav-n.workers.dev/health"
          if [ -n "$LINK_TRACKER_BASE" ]; then
            check "link tracker" "$LINK_TRACKER_BASE"
          else
            echo "link tracker: LINK_TRACKER_BASE не задан"
            exit 1
          fi
          # cf-subscribe принимает только POST; пустой JSON = invalid_email (400),
          # что подтверждает живость Worker без создания подписки.
          code=$(curl -sS -o /tmp/cf-subscribe.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" -d "{}" \
            https://cf-subscribe.valdislav-n.workers.dev/) || true
          echo "cf-subscribe: $code $(cat /tmp/cf-subscribe.json 2>/dev/null | head -c 120)"
          test "$code" = "400"


  llm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Groq model catalog
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ.get("GROQ_API_KEY", "")
          req = urllib.request.Request(
              "https://api.groq.com/openai/v1/models",
              headers={"Authorization": "Bearer " + token, "User-Agent": "content-factory-llm-check"},
          )
          with urllib.request.urlopen(req, timeout=25) as response:
              data = json.load(response)
          print("groq models:", [m.get("id") for m in data.get("data") or []])
          PY
      - run: python scripts/llm_check.py --max-tokens 120 --strict

  dify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
      DIFY_POSTS_API_KEY: ${{ secrets.DIFY_POSTS_API_KEY }}
      DIFY_NEWS_API_KEY: ${{ secrets.DIFY_NEWS_API_KEY }}
      DIFY_TRENDS_API_KEY: ${{ secrets.DIFY_TRENDS_API_KEY }}
      DIFY_SEO_API_KEY: ${{ secrets.DIFY_SEO_API_KEY }}
      DIFY_BASE_URL: ${{ secrets.DIFY_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m content_factory dify-apps
