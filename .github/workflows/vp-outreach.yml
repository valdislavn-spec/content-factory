name: vp-outreach

# Рассылка предложений о ВП/обмене рекламы владельцам каналов через user-session.
# ТРЕБУЕТ secrets: TG_API_ID, TG_API_HASH, TG_SESSION (StringSession владельца).
# Бот не может писать первым чужим админам — нужен аккаунт человека.
#
# Запуск: Actions → vp-outreach → Run workflow.
# По умолчанию dry_run=true: только печатает сообщения в лог, ничего не отправляет.
# Реальная отправка: dry_run=false, максимум 3–5 контактов за запуск (защита от спама).

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Регион/язык целей"
        required: true
        default: "en"
        type: choice
        options: ["en", "es", "all"]
      limit:
        description: "Сколько контактов за запуск (1–5)"
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3", "4", "5"]
      dry_run:
        description: "true = только показать сообщения"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "Telethon>=1.34"
      - name: Send outreach
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          flags=""
          if [ "${{ inputs.dry_run }}" = "false" ]; then flags="--live"; fi
          python scripts/vp_outreach.py \
            --region "${{ inputs.region }}" \
            --limit "${{ inputs.limit }}" $flags
