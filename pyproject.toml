[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-content-factory"
version = "1.0.0"
description = "Автономный контент-завод: сбор, анализ, суммаризация, публикация и аналитика для 6 Telegram-каналов"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Content Factory"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
telegram-sources = ["Telethon>=1.34"]
dev = ["pytest>=7.0"]

[project.scripts]
content-factory = "content_factory.cli:main"

[tool.setuptools.packages.find]
include = ["content_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
