# Optional NVIDIA GPU passthrough for the Ollama service (Linux only).
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.ml.yml \
#     -f docker-compose.gpu.yml up -d --build
#
# Requirements on the host:
#   - NVIDIA driver + nvidia-container-toolkit;
#   - Docker can see the GPU:
#       docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi
#
# Docker Desktop on macOS cannot pass Apple Metal/GPU into a Linux container;
# on Mac use Ollama on the host (Metal) instead of this overlay.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
