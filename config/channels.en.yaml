# =====================================================================
#  3 English-language Telegram channels (остальные каналы переведены на ES).
#
#  В telegram_chat_id прописаны числовые ID каналов (бот работает по ID):
#    SPORTNews0007        -1003802742871  спорт (US)
#    AINEWS0007           -1004351191643  ИИ
#    HOOPY0007            -1003891468537  крипто/блокчейн
#
#  Пост раз в 90 минут в каждый канал: 16 слотов/сутки (UTC), 48 постов/сутки.
#  Слоты: 00:00, 01:30, 03:00, 04:30, 06:00, 07:30, 09:00, 10:30, 12:00,
#         13:30, 15:00, 16:30, 18:00, 19:30, 21:00, 22:30.
#
#  Источники: RSS + API (World News / newsdata / Currents) с daily_limit;
#  для US-спорта — ESPN JSON API (type: espn, без ключа, UA браузера).
#  При исчерпании квоты API источник пропускается, канал работает на RSS.
#  Бот должен быть админом каждого канала (ID в telegram_chat_id).
# =====================================================================

channels:
- id: sport-news
  title: US Sports News
  description: 'NFL, NBA, MLB, NHL and college football: scores, trades, injuries
    and analysis.'
  telegram_chat_id: '-1003802742871'
  language: en
  topics:
  - nfl
  - nba
  - mlb
  - nhl
  - ncaa
  - college football
  - super bowl
  - playoffs
  - quarterback
  - touchdown
  - home run
  - draft
  - trade
  - injury
  - coach
  - championship
  - mvp
  - sport
  exclude_keywords:
  - advertisement
  - sponsored
  - casino
  - horoscope
  tone: friendly
  hashtags:
  - Sports
  - NFL
  - NBA
  - MLB
  sources:
  - id: espn-nfl
    type: espn
    url: https://site.api.espn.com/apis/site/v2/sports/football/nfl/news
    name: ESPN / NFL
    weight: 1.4
    options:
      sport: football/nfl
      max_items: 10
      trust: true
  - id: espn-nba
    type: espn
    url: https://site.api.espn.com/apis/site/v2/sports/basketball/nba/news
    name: ESPN / NBA
    weight: 1.3
    options:
      sport: basketball/nba
      max_items: 10
      trust: true
  - id: espn-mlb
    type: espn
    url: https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/news
    name: ESPN / MLB
    weight: 1.2
    options:
      sport: baseball/mlb
      max_items: 10
      trust: true
  - id: espn-nhl
    type: espn
    url: https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/news
    name: ESPN / NHL
    weight: 1.0
    options:
      sport: hockey/nhl
      max_items: 10
      trust: true
  - id: espn-cfb
    type: espn
    url: 
      https://site.api.espn.com/apis/site/v2/sports/football/college-football/news
    name: ESPN / College Football
    weight: 1.1
    options:
      sport: football/college-football
      max_items: 10
      trust: true
  - id: cbssports
    type: rss
    url: https://www.cbssports.com/rss/headlines/
    name: CBS Sports
    weight: 1.3
    options:
      trust: true
      max_items: 12
      full_text: true
  - id: sportingnews
    type: rss
    url: https://www.sportingnews.com/us/rss
    name: Sporting News
    weight: 1.2
    options:
      trust: true
      max_items: 10
      full_text: true
  - id: clutchpoints
    type: rss
    url: https://clutchpoints.com/feed
    name: ClutchPoints
    weight: 1.1
    options:
      trust: true
      max_items: 10
  - id: profootballtalk
    type: rss
    url: https://profootballtalk.nbcsports.com/feed/
    name: Pro Football Talk
    weight: 1.1
    options:
      trust: true
      max_items: 10
  - id: mlb-news
    type: rss
    url: https://www.mlb.com/feeds/news/rss.xml
    name: MLB.com
    weight: 1.0
    options:
      trust: true
      max_items: 8
      full_text: true
  - id: newsdata
    type: newsdata
    url: https://newsdata.io/api/1/latest
    name: newsdata.io
    weight: 1.0
    options:
      trust: true
      query: NFL NBA MLB NHL college football sport
      language: en
      max_items: 10
      daily_limit: 100
  enabled: true
  emoji: true
  formats:
  - story
  - analysis
  - interactive
  - digest
  schedule:
  - "01:20"
  - "03:40"
  - "07:00"
  - "08:00"
  - "09:00"
  - "10:20"
  - "12:00"
  - "13:00"
  - "17:00"
  - "18:00"
  - "19:00"
  - "20:00"
  - "21:00"
  - "22:00"
  - "23:00"
  posts_per_day: 15
  min_relevance: 0.18
  timezone_offset: -5
  max_post_chars: 1800
  cta: ''
  night_max_chars: 900
  night_window: 23:00-07:00
  content_mix:
    story: 30
    analysis: 40
    interactive: 30
  peak_windows:
  - 08:00-10:00
  - 12:00-14:00
  - 18:00-23:00
  content_mix_peak:
    story: 20
    analysis: 40
    interactive: 40
