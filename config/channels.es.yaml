# =====================================================================
#  3 испаноязычных Telegram-канала для ЛатАм и Испании (language: es).
#
#  tech-ai-es   — технологии и ИИ;
#  crypto-es    — крипто и блокчейн;
#  futbol-es    — футбол: LaLiga, Liga MX, Аргентина, MLS, Champions.
#
#  Язык постов — нейтральный испанский (es-419). Источники проверены
#  06.11.2026: рабочие RSS + ESPN JSON API с lang=es (футбол).
#
#  Расписание — по местному времени UTC-5 (Богота/Лима/Кито; Мексика
#  увидит посты на час раньше, Аргентина — на два позже). 6 постов/сутки.
#
#  ID каналов в Telegram — в .env:
#    TELEGRAM_CHAT_ID_TECH_AI_ES=@my_channel
#    TELEGRAM_CHAT_ID_CRYPTO_ES=@my_channel
#    TELEGRAM_CHAT_ID_FUTBOL_ES=@my_channel
#  Пока chat_id не задан, работает dry_run и посты падают в data/outbox.
# =====================================================================

channels:
- id: tech-ai-es
  title: Tecnología e IA
  description: 'Lo último en tecnología e inteligencia artificial en español: productos, empresas y tendencias.'
  telegram_chat_id: ''
  language: es
  topics:
  - inteligencia artificial
  - IA
  - tecnología
  - tecnológico
  - innovación
  - startup
  - fintech
  - ciberseguridad
  - software
  - aplicación
  - robot
  - chip
  - semiconductores
  - datos
  - nube
  - algoritmo
  - OpenAI
  - Google
  - Microsoft
  - Apple
  - Nvidia
  - Amazon
  - redes sociales
  - streaming
  - videojuego
  exclude_keywords:
  - publicidad
  - patrocinado
  - casino
  - horóscopo
  - apuestas
  tone: expert
  emoji: true
  hashtags:
  - Tecnología
  - IA
  - Innovación
  formats:
  - digest
  - story
  - analysis
  schedule:
  - '07:00'
  - '10:00'
  - '13:00'
  - '16:00'
  - '19:00'
  - '22:00'
  posts_per_day: 6
  min_relevance: 0.18
  timezone_offset: -5
  max_post_chars: 3200
  cta: Síguenos para más tecnología en español.
