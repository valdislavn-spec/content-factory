# Buffer: дублирование дневного пина в подключённые соцсети.
# Buffer: X (twitter) — только редкие ручные посты, без частой публикации
# (решение владельца 11.11.2026: «не публикуй часто в твиттере»).
# Facebook заблокирован (2026-11-10) — не публикуем.
# Bluesky — через прямой AT Protocol (пока канал не переподключён в Buffer).
# Ключ: BUFFER_API_KEY (Buffer → Settings → API).
organization_id: 68d276b0ab330eddbacc2da8
hub_url: https://valdislavn-spec.github.io/content-factory/

# Ссылки в каждом посте: статья (пин) + Telegram-канал, обе сокращаются.
links:
  shorten: true                 # TinyURL: длинные ссылки → одно короткое слово
  channel_default: https://t.me/HOOPY0007

# A/B CTA: варианты чередуются по дню (для замера кликов по UTM/шортлинкам).
# Партнёрская строка (Ad) для ниш, где уже есть оффер.
assets_alt_text: false          # Buffer API не принимает altText (ImageAssetInput) — alt только вручную в UI
partner_label: "Ad:"
niche_partners:
  crypto: https://links-tracker.valdislav-n.workers.dev/r/bingx-crypto-news
niche_channels:
  travel: https://t.me/HOOPY0007
  crypto: https://t.me/HOOPY0007
  ai: https://t.me/AINEWS0007
  sports: https://t.me/SPORTNews0007

# Стиль под нишу пина: эмодзи, хэштеги, CTA. Подставляется в шаблоны постов.
niches:
  travel:
    emoji: "🧳"
    hashtags: ["#travel", "#budgettravel"]
    cta: "Full guide:"
    cta_variants: ["Full guide:", "Save this:", "Plan the trip:"]
    question: "Which city is on your list this year?"
  crypto:
    emoji: "₿"
    hashtags: ["#bitcoin", "#crypto"]
    cta: "Live odds:"
    cta_variants: ["Live odds:", "See the numbers:", "Check the odds:"]
    question: "Would you take the other side of this trade?"
  ai:
    emoji: "🤖"
    hashtags: ["#AI", "#productivity"]
    cta: "Full guide:"
    cta_variants: ["Full guide:", "Try these:", "Save the list:"]
    question: "Which workflow would you automate first?"
  sports:
    emoji: "🏈"
    hashtags: ["#NFL", "#sports"]
    cta: "The numbers:"
    cta_variants: ["The numbers:", "See the data:", "Weekly picks:"]
    question: "Who do you like this week?"
# один пин в день, дальше — очередь Buffer (addToQueue)
mode: addToQueue

channels:
  - service: twitter
    name: NValdislav
    channel_id: 6951b346457dae6a34bd5e32
    max_chars: 280
    utm:
      utm_source: x
      utm_medium: social
      utm_campaign: daily_pin

# Quality-гейт: в очередь попадают только хорошие (отобранные) посты.
quality:
  allowed_slugs:
    - 01-europe-for-under-300
    - 02-bali-on-a-budget
    - 03-48-hours-in-rome
    - 04-travel-insurance-mistakes
  repeat_after_days: 14
  min_text: 80
  require_image: true
state_path: data/buffer_state.json

# Расписание постов в Buffer (UTC). Режим --schedule ставит посты с
# customScheduled на эти слоты — независимо от Buffer-овского queue schedule.
# Число слотов в день × horizon_days должно укладываться в лимит Free-плана
# (10 запланированных постов на канал).
#
# Слоты подобраны под аудиторию США (страница «The best offers» — New York):
#   facebook 20:00 / 23:00 UTC = 15:00 / 18:00 ET = 12:00 / 15:00 PT
#   twitter  16:00 / 22:00 UTC = 11:00 / 17:00 ET = 08:00 / 14:00 PT
# (прежние 11:00/19:00 UTC давали 06:00/14:00 ET и 03:00/11:00 PT — ночь/утро)
#
# ВАЖНО (11.11.2026): плановых слотов для X/Twitter НЕТ — частые публикации не нужны.
# X используем только для редкого ручного поста (workflow_dispatch buffer-queue --live).
schedule:
  timezone: UTC
  horizon_days: 3
  times:
    twitter: []
