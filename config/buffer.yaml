# Buffer: дублирование дневного пина в подключённые соцсети.
# Free plan = 3 канала: Bluesky, X (twitter), Facebook.
# Ключ: BUFFER_API_KEY (Buffer → Settings → API).
organization_id: 68d276b0ab330eddbacc2da8
hub_url: https://valdislavn-spec.github.io/content-factory/
# один пин в день, дальше — очередь Buffer (addToQueue)
mode: addToQueue

channels:
