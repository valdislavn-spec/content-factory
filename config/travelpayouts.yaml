# Travelpayouts: партнёрские ссылки для пинов.
# Нужны: API token (Profile → API token), Partner ID (marker, внизу слева в
# кабинете), Project ID (trs, список проектов). Лучше хранить в env/secrets:
#   TRAVELPAYOUTS_TOKEN, TRAVELPAYOUTS_MARKER, TRAVELPAYOUTS_TRS
#
# Схема: пин ведёт на наш хаб (/go/<slug>.html), страница редиректит на
# партнёрскую ссылку Travelpayouts. Так пин остаётся «на нашем хабе», а клик
# засчитывается партнёрке.
hub_public_base: https://valdislavn-spec.github.io/content-factory
shorten: true

# brand URL, который конвертируем в партнёрский (полные ссылки, не короткие)
programs:
  aviasales: https://www.aviasales.com/
  booking: https://www.booking.com/
  getyourguide: https://www.getyourguide.com/

# какой пин (файл sidecar без .json) в какую программу ведём
pins:
  "01-europe-for-under-300":
    program: aviasales
    sub_id: pin_europe
    partner_url: https://aviasales.tpk.ro/b3PI8GVN
