# Ротация постов для Fediverse (Akkoma): крипто/трейдинг → AI×трейдинг → travel-реклама.
# Скрипт: scripts/fediverse_mix.py; workflow: .github/workflows/fediverse-mix.yml
enabled: true
crosspost:
  mastodon: true          # дублировать пост в Mastodon (MASTODON_* в .env)
  mastodon_strip_links: false   # в дублях оставляем партнёрские ссылки
state_path: data/fediverse_mix_state.json
rotation: [crypto, ai, travel]      # по одному посту на тему по кругу
telegram_crypto: https://t.me/HOOPY0007
telegram_ai: https://t.me/AINEWS0007
travel_link: https://links-tracker.valdislav-n.workers.dev/r/travel-default
travel_disclosure: "Ad · travel partner · prices vary."
travel_headlines:
  - "Travel season is back — flights, hotels and city breaks are moving fast."
  - "Planning the next trip? These are the travel stories worth your time."
  - "Weekend escape or long haul: travel deals are moving fast."

# Красивые обложки: график BTC для крипто, AI-карточка, travel-карточка
# Картинки из статей: свежие RSS-новости каналов → og:image/media.
# Если картинки нет — рисуем свою карточку (image ниже).
article_images:
  enabled: true
  channels_config: config/channels.en.yaml
  max_age_hours: 48
  max_feeds: 4
  max_candidates: 6
  feeds:
    travel:
      - https://thepointsguy.com/feed/
      - https://www.nomadicmatt.com/feed/
      - https://www.atlasobscura.com/feeds/latest
      - https://www.traveldailymedia.com/feed/
      - https://www.travelpayouts.com/blog/feed/

image:
  enabled: true
  width: 1200
  height: 675
  footer: "Crypto & Blockchain · t.me/HOOPY0007"

crypto_headlines:
  - "BTC holds above $76k as traders watch ETF flows and the next macro signal."
  - "Crypto markets are grinding higher: what the last 24h says about positioning."
  - "Volatility is back on the menu — here is where BTC, ETH and SOL stand."
  - "Traders are watching the same levels: BTC support, ETH rotation, SOL momentum."

ai_angles:
  - "AI agents are moving from chat to trading desks: LLM research, sentiment scans and automated strategies."
  - "The new crypto edge may be AI: faster research, broader monitoring, fewer missed signals."
  - "AI + trading is not about magic bots — it is about compressing research time and enforcing risk limits."
  - "Models do not replace discipline: AI finds patterns, traders still manage risk."

templates:
  crypto: |
    📈 {headline}

    Markets (BingX): {market_line}

    US crypto news → {telegram_crypto}

    #Bitcoin #Crypto #Trading
  ai: |
    🤖 {ai_angle}

    The catch: a model is only as good as its data and risk limits. AI adds speed — discipline still wins.

    AI + crypto coverage → {telegram_ai}

    #AI #Crypto #Trading
  travel: |
    ✈️ {travel_headline}

    Plan the next trip with our travel partner: {travel_link}

    {travel_disclosure}

    #Travel #Deals
