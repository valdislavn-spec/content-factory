# =====================================================================
#  6 Telegram-каналов контент-завода.
#
#  Как изменить канал:
#    1) скопируйте блок канала и задайте уникальный id;
#    2) перечислите ключевые слова темы в topics (по ним отбираются новости);
#    3) перечислите источники sources (rss / web / telegram);
#    4) задайте schedule — времена публикации по Москве (HH:MM).
#
#  ID каналов в Telegram НЕ храните здесь: используйте .env
#  (TELEGRAM_CHAT_ID_TECH_AI=@my_channel или -1001234567890).
#  Пока не настроен бот, всё работает в dry_run и посты падают в data/outbox.
#  options: {trust: true} — тематический источник, его лента принимается
#  без жёсткого фильтра по ключевым словам (стоп-слова канала действуют).
# =====================================================================

