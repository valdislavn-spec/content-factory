# Kalshi prediction-market digests for the channels.
# Public market data: no API key required. Signed requests (portfolio/orders)
# need an API key — see docs/kalshi.md.
base_url: https://external-api.kalshi.com
status: open
limit: 200
# exclude multivariate/parlay markets (they have garbage comma-list titles)
mve_filter: exclude

digests:
  - channel: crypto-news
    language: en
    title: "📊 Crypto prediction markets right now"
    keywords: ["bitcoin", "btc", "ethereum", "eth", "solana", "crypto"]
    series_tickers: ["KXBTC", "KXETH", "KXSOL", "KXDOGEMAXM", "KXTOKENLAUNCHAXIOM"]
    min_volume: 0
    max_items: 4
    fallback_top: true
    affiliate_url: ""

  - channel: sport-news
    language: en
    title: "🏈 Sports prediction markets"
    keywords: ["nfl", "nba", "mlb", "nhl", "super bowl", "playoff", "championship"]
    series_tickers: ["KXPSL", "KXNCAAFSEED", "KXNBATEAMWINSTREAK", "KXNBACUPGROUPWIN", "KXWCSTAGEOFELIM"]
    min_volume: 0
    max_items: 3
    fallback_top: true
    affiliate_url: ""

  - channel: ai-news
    language: en
    title: "🤖 AI & tech prediction markets"
    keywords: ["ai", "openai", "gpt", "nvidia", "apple", "google", "meta"]
    series_tickers: ["KXMETAA", "KXACQUIRECHROME", "KXUSTESTSMATH", "KXUBER"]
    min_volume: 0
    max_items: 3
    fallback_top: true
    affiliate_url: ""

# Affiliate / referral link (Kalshi "Refer a friend": app → Explore → menu →
# Your rewards → Offers). Shown at most once per day, in the 12:15 UTC digest
# run only. Leave url empty to disable. US referral offers only.
affiliate:
  enabled: true
  url: ""            # paste your Kalshi referral link here, e.g. https://kalshi.com/r/XXXX
  disclosure: "Ad"
  once_per_day: true
  daily_hour_utc: 12
  text_en: "🔗 Trade prediction markets on Kalshi: {url} · {disclosure}"
  text_es: "🔗 Opera en mercados de predicción con Kalshi: {url} · {disclosure}"
