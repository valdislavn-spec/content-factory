#             python scripts/mastodon_publish.py --apply    # реально
# Креды (в .env или GitHub Secrets):
#   MASTODON_BASE_URL / MASTODON_TOKEN
#   либо per-channel: MASTODON_BASE_URL_<CHANNEL_ID> / MASTODON_TOKEN_<CHANNEL_ID>
